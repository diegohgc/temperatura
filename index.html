<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>Temperatura</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #1e3a5f, #3a6ea5);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    transition: background 1.5s ease, color 1.5s ease;
  }
  .card {
    text-align: center;
    width: 100%;
    max-width: 360px;
  }
  .ciudad-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .ciudad {
    font-size: 1.2rem;
    opacity: 0.85;
  }
  .btn-buscar {
    background: none;
    border: none;
    padding: 4px;
    opacity: 0.55;
    cursor: pointer;
    line-height: 0;
  }
  .btn-buscar-texto {
    font-size: 0.72rem;
    opacity: 0.7;
    color: #fff;
    vertical-align: middle;
  }
  .btn-buscar svg {
    width: 16px;
    height: 16px;
    stroke: #fff;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .buscador {
    max-width: 260px;
    margin: 0 auto 10px;
  }
  .buscador input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 0.85rem;
  }
  .buscador input::placeholder {
    color: rgba(255,255,255,0.6);
  }
  .resultados {
    text-align: left;
    margin-top: 4px;
  }
  .resultado-item {
    padding: 6px 10px;
    font-size: 0.85rem;
    opacity: 0.9;
    cursor: pointer;
    border-radius: 8px;
  }
  .resultado-item:active {
    background: rgba(255,255,255,0.15);
  }
  .link-ubicacion {
    background: none;
    border: none;
    color: #bfe0ff;
    font-size: 0.8rem;
    padding: 6px 0 0;
    text-decoration: underline;
    cursor: pointer;
  }
  .icono {
    width: 38px;
    height: 38px;
    margin: 4px auto 0;
  }
  .aire {
    font-size: 0.8rem;
    opacity: 0.85;
    margin-bottom: 6px;
    min-height: 1em;
  }
  .icono svg {
    width: 100%;
    height: 100%;
    stroke: #fff;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .temp {
    font-size: 3.2rem;
    font-weight: 600;
    line-height: 1;
    margin: 2px 0 8px;
  }
  .desc {
    font-size: 0.95rem;
    opacity: 0.9;
    margin-bottom: 16px;
  }
  .detalles {
    display: flex;
    justify-content: center;
    gap: 24px;
    font-size: 0.95rem;
    opacity: 0.8;
    margin-bottom: 28px;
  }
  button {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:active { background: rgba(255,255,255,0.3); }
  .estado {
    margin-top: 20px;
    font-size: 0.9rem;
    opacity: 0.75;
    min-height: 1.2em;
  }
  .marea {
    font-size: 0.95rem;
    opacity: 0.9;
    margin-bottom: 20px;
    min-height: 1.2em;
  }
  .horas {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 4px 4px 16px;
    margin-bottom: 8px;
  }
  .hora {
    flex: 0 0 auto;
    text-align: center;
    min-width: 46px;
  }
  .hora .h {
    font-size: 0.8rem;
    opacity: 0.75;
    margin-bottom: 4px;
  }
  .hora .icono-hora {
    width: 30px;
    height: 30px;
    margin: 0 auto 4px;
  }
  .hora .icono-hora svg {
    width: 100%;
    height: 100%;
    stroke: #fff;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .hora .t {
    font-size: 0.9rem;
    font-weight: 600;
  }
  .hora .p {
    font-size: 0.75rem;
    opacity: 0.8;
    color: #bfe0ff;
    margin-top: 2px;
  }
  .dia {
    flex: 0 0 auto;
    text-align: center;
    min-width: 52px;
  }
  .dia .d {
    font-size: 0.8rem;
    opacity: 0.75;
    margin-bottom: 4px;
    text-transform: capitalize;
  }
  .dia .icono-dia {
    width: 30px;
    height: 30px;
    margin: 0 auto 4px;
  }
  .dia .icono-dia svg {
    width: 100%;
    height: 100%;
    stroke: #fff;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .dia .max {
    font-size: 0.9rem;
    font-weight: 600;
  }
  .dia .min {
    font-size: 0.8rem;
    opacity: 0.7;
  }

  @media (orientation: landscape) and (max-height: 500px) {
    body {
      align-items: flex-start;
      padding-top: 4px;
      padding-bottom: 4px;
    }
    .card {
      max-width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 16px;
      text-align: center;
    }
    .ciudad-row     { grid-column: 1 / 3; grid-row: 1; margin-bottom: 0; }
    .ciudad         { font-size: 1rem; }
    .buscador       { grid-column: 1 / 3; grid-row: 2; }
    #altitud        { grid-column: 1; grid-row: 3; font-size: 0.8rem; margin-bottom: 0; }
    #solInfo        { grid-column: 1; grid-row: 4; font-size: 0.8rem; gap: 12px; margin-bottom: 0; }
    #marea          { grid-column: 1; grid-row: 5; font-size: 0.8rem; margin-bottom: 0; }
    #icono          { grid-column: 1; grid-row: 6; width: 28px; height: 28px; margin: 0 auto; }
    #desc           { grid-column: 1; grid-row: 7; font-size: 0.8rem; margin-bottom: 2px; }
    #aire           { grid-column: 1; grid-row: 8; font-size: 0.72rem; margin-bottom: 0; }
    #temp           { grid-column: 1; grid-row: 9; font-size: 2rem; margin: 0; }
    .detalles:not(#solInfo) { grid-column: 1; grid-row: 10; font-size: 0.8rem; margin-bottom: 0; gap: 12px; }
    #horas          { grid-column: 2; grid-row: 1 / 6; align-self: center; padding-bottom: 4px; }
    #dias           { grid-column: 2; grid-row: 6 / 11; align-self: center; }
    #btnActualizar  { grid-column: 1; grid-row: 11; margin: 2px auto; padding: 6px 16px; font-size: 0.8rem; }
    #estado         { grid-column: 1 / 3; grid-row: 12; font-size: 0.75rem; }
  }
</style>

        <span class="btn-buscar-texto" id="textoCambiarCiudad"></span>
      </button>
    </div>
    <div class="buscador" id="buscador" hidden>

      <div class="resultados" id="resultadosCiudad"></div>
      <button class="link-ubicacion" id="btnUsarGps">Usar mi ubicación</button>
    </div>
    <div class="marea" id="altitud"></div>
    <div class="detalles" id="solInfo"></div>
    <div class="marea" id="marea"></div>
    <div class="icono" id="icono"></div>
    <div class="desc" id="desc"></div>
    <div class="aire" id="aire"></div>

    <div class="detalles">
      <span id="sensacion"></span>
      <span id="viento"></span>
      <span id="humedad"></span>
    </div>
    <div class="horas" id="horas"></div>
    <div class="horas" id="dias"></div>
    <button id="btnActualizar">Actualizar</button>
    <div class="estado" id="estado"></div>
  </div>

function detectarIdioma() {
  const full = (navigator.language || navigator.userLanguage || 'es').toLowerCase();
  if (full.startsWith('ca')) return 'ca';
  if (full.startsWith('eu')) return 'eu';
  if (full.startsWith('gl')) return 'gl';
  const lang = full.substring(0, 2);
  return TRADUCCIONES[lang] ? lang : 'en';
}

function iconoParaCodigo(codigo, esDia = true) {
  if (codigo === 0) return esDia ? ICONOS.sol : ICONOS.luna;
  if (codigo === 1 || codigo === 2) return esDia ? ICONOS.solNube : ICONOS.lunaNube;
  if (codigo === 3) return ICONOS.nube;
  if (codigo === 45 || codigo === 48) return ICONOS.niebla;
  if (codigo >= 51 && codigo <= 55) return ICONOS.llovizna;
  if ((codigo >= 61 && codigo <= 65) || (codigo >= 80 && codigo <= 82)) return ICONOS.lluvia;
  if (codigo >= 71 && codigo <= 75) return ICONOS.nieve;
  if (codigo >= 95) return ICONOS.tormenta;
  return ICONOS.solNube;
}

const CODIGOS = T.codigos;

function setEstado(msg) { elEstado.textContent = msg; }

function colorParaTemp(temp) {
  const rangos = [
    { t: 0,  c1: '#b8d8f0', c2: '#8ab8d8', texto: '#1a3a5c' },
    { t: 10, c1: '#1e3a5f', c2: '#3a6ea5', texto: '#ffffff' },
    { t: 18, c1: '#1a4a6e', c2: '#2a7a8a', texto: '#ffffff' },
    { t: 24, c1: '#1e5c3a', c2: '#2e8a5a', texto: '#ffffff' },
    { t: 30, c1: '#7a4a10', c2: '#c07020', texto: '#ffffff' },
    { t: 35, c1: '#8a2a10', c2: '#c04020', texto: '#ffffff' },
    { t: 999,c1: '#6a1010', c2: '#a02020', texto: '#ffffff' },
  ];
  for (let i = 0; i < rangos.length - 1; i++) {
    const a = rangos[i], b = rangos[i + 1];
    if (temp <= a.t || (temp >= a.t && temp < b.t)) {
      if (temp <= a.t) return a;
      const ratio = (temp - a.t) / (b.t - a.t);
      return {
        c1: interpolarColor(a.c1, b.c1, ratio),
        c2: interpolarColor(a.c2, b.c2, ratio),
        texto: ratio < 0.5 ? a.texto : b.texto
      };
    }
  }
  return rangos[rangos.length - 1];
}

function interpolarColor(hex1, hex2, t) {
  const r1 = parseInt(hex1.slice(1,3),16), g1 = parseInt(hex1.slice(3,5),16), b1 = parseInt(hex1.slice(5,7),16);
  const r2 = parseInt(hex2.slice(1,3),16), g2 = parseInt(hex2.slice(3,5),16), b2 = parseInt(hex2.slice(5,7),16);
  const r = Math.round(r1 + (r2-r1)*t), g = Math.round(g1 + (g2-g1)*t), b = Math.round(b1 + (b2-b1)*t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function aplicarColorTemp(temp) {
  const col = colorParaTemp(temp);
  document.body.style.background = `linear-gradient(160deg, ${col.c1}, ${col.c2})`;
  document.body.style.color = col.texto;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', col.c1);
}

async function obtenerCiudad(lat, lon) {
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`);
    const data = await r.json();
    const barrio = data.locality;
    const ciudad = data.city;
    if (barrio && ciudad && barrio !== ciudad) return `${barrio}, ${ciudad}`;
    if (ciudad) return ciudad;
    if (barrio) return barrio;
  } catch (e) {}
  return T.tuUbicacion;
}

async function obtenerTiempo(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code&forecast_days=7&timezone=auto`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Error al consultar el tiempo');
  return r.json();
}

function renderHoras(hourly) {
  elHoras.innerHTML = '';
  if (!hourly || !hourly.time) return;
  const ahora = Date.now();
  const indices = hourly.time
    .map((t, i) => ({ i, t: new Date(t).getTime() }))
    .filter((x) => x.t >= ahora)
    .slice(0, 8);

  for (const { i, t } of indices) {
    const hora = new Date(t).getHours() + 'h';
    const temp = Math.round(hourly.temperature_2m[i]);
    const prob = hourly.precipitation_probability ? hourly.precipitation_probability[i] : null;
    const div = document.createElement('div');
    div.className = 'hora';
    div.innerHTML = `
      <div class="h">${hora}</div>
      <div class="icono-hora">${iconoParaCodigo(hourly.weather_code[i], hourly.is_day ? hourly.is_day[i] === 1 : true)}</div>
      <div class="t">${temp}°</div>
      ${prob !== null ? `<div class="p">${prob}%</div>` : ''}
    `;
    elHoras.appendChild(div);
  }
}

function renderSol(daily) {
  elSolInfo.innerHTML = '';
  if (!daily || !daily.sunrise || !daily.sunrise[0]) return;
  const amanecer = new Date(daily.sunrise[0]).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
  const anochecer = new Date(daily.sunset[0]).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
  elSolInfo.innerHTML = `<span>${T.amanecer} ${amanecer}</span><span>${T.anochecer} ${anochecer}</span>`;
}

function renderDias(daily) {
  elDias.innerHTML = '';
  if (!daily || !daily.time) return;
  const hoy = new Date().toDateString();

  daily.time.forEach((fecha, i) => {
    const d = new Date(fecha + 'T12:00:00');
    const esHoy = d.toDateString() === hoy;
    const nombreDia = esHoy ? T.hoy : d.toLocaleDateString(T.locale, { weekday: 'short' }).replace('.', '');
    const max = Math.round(daily.temperature_2m_max[i]);
    const min = Math.round(daily.temperature_2m_min[i]);
    const div = document.createElement('div');
    div.className = 'dia';
    div.innerHTML = `
      <div class="d">${nombreDia}</div>
      <div class="icono-dia">${iconoParaCodigo(daily.weather_code[i], true)}</div>
      <div class="max">${max}°</div>
      <div class="min">${min}°</div>
    `;
    elDias.appendChild(div);
  });
}

async function obtenerMarea(lat, lon) {
  const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=sea_level_height_msl&forecast_days=2&timezone=auto`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Error al consultar la marea');
  const data = await r.json();
  const tiempos = data.hourly && data.hourly.time;
  const alturas = data.hourly && data.hourly.sea_level_height_msl;
  if (!tiempos || !alturas) return null;

  const esCostero = alturas.some((h) => h !== null);
  if (!esCostero) return null;

  const ahora = Date.now();
  let idx = tiempos.findIndex((t) => new Date(t).getTime() >= ahora);
  if (idx <= 0) idx = 0;
  if (idx >= alturas.length - 1) return null;

  const subiendo = alturas[idx + 1] > alturas[idx];

  let k = idx + 1;
  while (k < alturas.length - 1) {
    const subiendoAhi = alturas[k + 1] > alturas[k];
    if (subiendoAhi !== subiendo) break;
    k++;
  }
  if (k >= alturas.length - 1) return subiendo ? 'Marea subiendo' : 'Marea bajando';

  let horaExtremo = new Date(tiempos[k]).getTime();
  if (k > 0 && k < alturas.length - 1) {
    const h0 = alturas[k - 1];
    const h1 = alturas[k];
    const h2 = alturas[k + 1];
    const denominador = h0 - 2 * h1 + h2;
    if (denominador !== 0) {
      const offsetHoras = 0.5 * (h0 - h2) / denominador;
      if (offsetHoras > -1 && offsetHoras < 1) {
        horaExtremo += offsetHoras * 3600000;
      }
    }
  }

  const horaTexto = new Date(horaExtremo).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
  return subiendo
    ? `${T.mareaSubiendo} ${horaTexto}`
    : `${T.mareaBajando} ${horaTexto}`;
}

async function obtenerElevacionTerreno(lat, lon) {
  const r = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`);
  if (!r.ok) throw new Error('Error al consultar la elevación');
  const data = await r.json();
  return data.elevation && data.elevation.length ? data.elevation[0] : null;
}

async function obtenerCalidadAire(lat, lon) {
  const r = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi`);
  if (!r.ok) throw new Error();
  const data = await r.json();
  const aqi = data.current && data.current.european_aqi;
  if (aqi === null || aqi === undefined) return null;
  const niveles = [
    { max: 20,  texto: { es:'Calidad del aire: Muy buena', en:'Air quality: Very good', de:'Luftqualität: Sehr gut', fr:'Qualité de l\'air: Très bonne', pt:'Qualidade do ar: Muito boa', it:'Qualità dell\'aria: Ottima', zh:'空气质量：优', ca:'Qualitat de l\'aire: Molt bona', eu:'Airearen kalitatea: Oso ona', gl:'Calidade do aire: Moi boa' } },
    { max: 40,  texto: { es:'Calidad del aire: Buena',     en:'Air quality: Good',      de:'Luftqualität: Gut',      fr:'Qualité de l\'air: Bonne',      pt:'Qualidade do ar: Boa',      it:'Qualità dell\'aria: Buona',  zh:'空气质量：良', ca:'Qualitat de l\'aire: Bona',     eu:'Airearen kalitatea: Ona',     gl:'Calidade do aire: Boa'    } },
    { max: 60,  texto: { es:'Calidad del aire: Moderada',  en:'Air quality: Moderate',  de:'Luftqualität: Mäßig',    fr:'Qualité de l\'air: Modérée',    pt:'Qualidade do ar: Moderada',  it:'Qualità dell\'aria: Moderata',zh:'空气质量：中等', ca:'Qualitat de l\'aire: Moderada', eu:'Airearen kalitatea: Moderatua',gl:'Calidade do aire: Moderada'} },
    { max: 80,  texto: { es:'Calidad del aire: Mala',      en:'Air quality: Poor',      de:'Luftqualität: Schlecht',  fr:'Qualité de l\'air: Mauvaise',   pt:'Qualidade do ar: Ruim',      it:'Qualità dell\'aria: Scarsa',  zh:'空气质量：差', ca:'Qualitat de l\'aire: Dolenta',  eu:'Airearen kalitatea: Txarra',   gl:'Calidade do aire: Mala'   } },
    { max: 999, texto: { es:'Calidad del aire: Muy mala',  en:'Air quality: Very poor',  de:'Luftqualität: Sehr schlecht',fr:'Qualité de l\'air: Très mauvaise',pt:'Qualidade do ar: Muito ruim',it:'Qualità dell\'aria: Pessima',zh:'空气质量：极差', ca:'Qualitat de l\'aire: Molt dolenta',eu:'Airearen kalitatea: Oso txarra',gl:'Calidade do aire: Moi mala'} },
  ];
  const nivel = niveles.find(n => aqi <= n.max) || niveles[niveles.length - 1];
  return nivel.texto[idioma] || nivel.texto['en'];
}

async function obtenerAltitud(lat, lon) {
  const elevacion = await obtenerElevacionTerreno(lat, lon);
  if (elevacion === null) return null;
  return `${T.altitud} ${Math.round(elevacion)} m`;
}

async function cargarDatos(latitude, longitude, nombreFijo) {
  setEstado(T.consultando);
  try {
    const [tiempo, ciudad, marea, altitudTexto, aireTexto] = await Promise.all([
      obtenerTiempo(latitude, longitude),
      nombreFijo ? Promise.resolve(nombreFijo) : obtenerCiudad(latitude, longitude),
      obtenerMarea(latitude, longitude).catch(() => null),
      obtenerAltitud(latitude, longitude).catch(() => null),
      obtenerCalidadAire(latitude, longitude).catch(() => null)
    ]);
    const c = tiempo.current;
    elCiudad.textContent = ciudad;
    elTemp.textContent = Math.round(c.temperature_2m) + '°';
    elDesc.textContent = CODIGOS[c.weather_code] || '';
    elIcono.innerHTML = iconoParaCodigo(c.weather_code, c.is_day === 1);
    renderHoras(tiempo.hourly);
    renderSol(tiempo.daily);
    renderDias(tiempo.daily);
    aplicarColorTemp(Math.round(c.temperature_2m));
    elSensacion.textContent = T.sensacion + ' ' + Math.round(c.apparent_temperature) + '°';
    elViento.textContent = Math.round(c.wind_speed_10m) + ' km/h';
    elHumedad.textContent = c.relative_humidity_2m + T.humedad;
    elMarea.textContent = marea || '';
    elAltitud.textContent = altitudTexto || '';
    document.getElementById('aire').textContent = aireTexto || '';
    setEstado(T.actualizado + ' ' + new Date().toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    setEstado(T.errorTemperatura);
  }
}

async function actualizar() {
  setEstado(T.localizando);
  elTemp.textContent = '--°';
  elDesc.textContent = '';

  if (ubicacionManual) {
    cargarDatos(ubicacionManual.lat, ubicacionManual.lon, ubicacionManual.nombre);
    return;
  }

  if (!navigator.geolocation) {
    setEstado(T.geoNoDisponible);
    return;
  }

  navigator.geolocation.getCurrentPosition((pos) => {
    cargarDatos(pos.coords.latitude, pos.coords.longitude);
  }, (err) => {
    if (err.code === err.PERMISSION_DENIED) {
      setEstado(T.permisoDenegado);
    } else {
      setEstado(T.errorUbicacion);
    }
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

let timeoutBusqueda = null;

function cerrarBuscador() {
  elBuscador.hidden = true;
  inputCiudad.value = '';
  elResultadosCiudad.innerHTML = '';
}

btnBuscarCiudad.addEventListener('click', () => {
  elBuscador.hidden = !elBuscador.hidden;
  if (!elBuscador.hidden) inputCiudad.focus();
});

inputCiudad.addEventListener('input', () => {
  clearTimeout(timeoutBusqueda);
  const texto = inputCiudad.value.trim();
  if (texto.length < 2) {
    elResultadosCiudad.innerHTML = '';
    return;
  }
  timeoutBusqueda = setTimeout(async () => {
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(texto)}&count=5&language=es`);
      const data = await r.json();
      elResultadosCiudad.innerHTML = '';
      (data.results || []).forEach((res) => {
        const nombre = res.name + (res.admin1 ? `, ${res.admin1}` : '') + (res.country ? `, ${res.country}` : '');
        const item = document.createElement('div');
        item.className = 'resultado-item';
        item.textContent = nombre;
        item.addEventListener('click', () => {
          ubicacionManual = { lat: res.latitude, lon: res.longitude, nombre: res.name + (res.admin1 ? `, ${res.admin1}` : '') };
          cerrarBuscador();
          cargarDatos(ubicacionManual.lat, ubicacionManual.lon, ubicacionManual.nombre);
        });
        elResultadosCiudad.appendChild(item);
      });
    } catch (e) {}
  }, 350);
});

btnUsarGps.addEventListener('click', () => {
  ubicacionManual = null;
  cerrarBuscador();
  actualizar();
});

btn.addEventListener('click', actualizar);
window.addEventListener('load', actualizar);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
