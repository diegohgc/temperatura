<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>Temperatura</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  #bg {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(160deg, #1e3a5f, #3a6ea5);
    transition: background 1.5s ease;
  }
  #bg::after {
    content: '';

    pointer-events: none;
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    color: #fff;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 16px) + 60px);
    transition: color 1.5s ease;
  }
  .card {
    text-align: center;
    width: 100%;
    max-width: 420px;
    padding-top: 8px;
    position: relative;
  }
  .btn-buscar {
    background: none;
    border: none;
    padding: 4px;
    opacity: 0.55;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 0 auto 6px;
  }
  .btn-buscar-texto { font-size: 0.72rem; color: #fff; line-height: 1; }
  .btn-buscar svg {
    width: 16px; height: 16px;
    stroke: #fff; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .buscador { max-width: 260px; margin: 0 auto 10px; }
  .buscar-fila { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 4px; }
  .btn-fav { background: none; border: none; cursor: pointer; font-size: 1rem; color: inherit; opacity: 0.75; padding: 0; line-height: 1; transition: opacity 0.2s; display: flex; align-items: center; gap: 4px; }
  .btn-fav:hover { opacity: 1; }
  .btn-ajustes { position: absolute; top: 10px; left: 1px; background: rgba(255,255,255,0.15); border: none; border-radius: 6px; color: inherit; font-size: 0.8rem; padding: 2px 6px; cursor: pointer; opacity: 0.8; transition: opacity 0.2s; line-height: 1; }
  .btn-ajustes:hover { opacity: 1; }
  .btn-ayuda { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; color: inherit; font-size: 0.85rem; font-weight: 700; width: 26px; height: 26px; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .btn-ayuda:hover { opacity: 1; }
  #ayudaModal { display: none; position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
  #ayudaModal.open { display: flex; }
  .ayuda-box { background: var(--card-bg,#1e2330); border-radius: 20px; padding: 24px 20px 20px; width: 88vw; max-width: 360px; position: relative; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
  .ayuda-close { position: absolute; top: 12px; right: 14px; background: rgba(255,255,255,0.1); border: none; color: inherit; border-radius: 50%; width: 28px; height: 28px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ayuda-titulo { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; }
  .ayuda-sub { font-size: 0.8rem; opacity: 0.6; margin-bottom: 16px; }
  .ayuda-lista { display: flex; flex-direction: column; gap: 11px; }
  .ayuda-item { display: flex; align-items: flex-start; gap: 10px; font-size: 0.85rem; line-height: 1.35; }
  .ayuda-item-icon { font-size: 1.2rem; flex-shrink: 0; width: 24px; text-align: center; }
  .ayuda-item-text b { display: block; font-weight: 700; }
  .ayuda-item-text span { opacity: 0.65; font-size: 0.78rem; }
  .ayuda-footer { margin-top: 18px; font-size: 0.75rem; opacity: 0.45; text-align: center; }
  .ajustes-panel { position: absolute; top: 38px; left: 12px; background: rgba(30,30,40,0.92); backdrop-filter: blur(8px); border-radius: 10px; padding: 10px 14px; z-index: 100; min-width: 180px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  .ajustes-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 0.82rem; opacity: 0.9; }
  .ajustes-fila:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.1); }
  .ajustes-label { color: #fff; }
  .ajustes-toggle { display: flex; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; }
  .ajustes-toggle button { background: none; border: none; color: #fff; font-size: 0.78rem; font-weight: 600; padding: 4px 9px; cursor: pointer; opacity: 0.55; transition: opacity 0.15s, background 0.15s; }
  .ajustes-toggle button.activo { background: rgba(255,255,255,0.25); opacity: 1; }
  .ajustes-select { background: rgba(255,255,255,0.12); border: none; border-radius: 6px; color: #fff; font-size: 0.78rem; font-weight: 600; padding: 4px 8px; cursor: pointer; outline: none; }
  .ajustes-favs-titulo { font-size: 0.7rem; opacity: 0.55; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; margin: 8px 0 4px; }
  .ajustes-fav-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; border-radius: 7px; background: rgba(255,255,255,0.08); margin-bottom: 4px; cursor: pointer; transition: background 0.15s; }
  .ajustes-fav-item:hover { background: rgba(255,255,255,0.18); }
  .ajustes-fav-nombre { font-size: 0.82rem; color: #fff; }
  .ajustes-fav-remove { background: none; border: none; color: #fff; opacity: 0.4; cursor: pointer; font-size: 0.85rem; padding: 0 0 0 8px; line-height: 1; }
  .ajustes-fav-remove:hover { opacity: 0.9; }
  .btn-fav-texto { font-size: 0.82rem; }
  .fav-titulo { font-size: 0.7rem; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.06em; margin: 10px 0 5px; }
  .fav-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.1); margin-bottom: 5px; cursor: pointer; }
  .fav-item:hover { background: rgba(255,255,255,0.18); }
  .fav-nombre { font-size: 0.88rem; }
  .fav-remove { background: none; border: none; color: inherit; opacity: 0.45; cursor: pointer; font-size: 1rem; padding: 2px 0 2px 8px; }
  .fav-remove:hover { opacity: 1; }
  .buscador input {
    width: 100%; padding: 8px 12px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.1); color: #fff; font-size: 0.85rem;
  }
  .buscador input::placeholder { color: rgba(255,255,255,0.6); }
  .resultados { text-align: left; margin-top: 4px; }
  .resultado-item { padding: 6px 10px; font-size: 0.85rem; opacity: 0.9; cursor: pointer; border-radius: 8px; }
  .resultado-item:active { background: rgba(255,255,255,0.15); }
  .link-ubicacion {
    background: none; border: none; color: #bfe0ff;
    font-size: 0.8rem; padding: 6px 0 0; text-decoration: underline; cursor: pointer;
  }
  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
    text-align: left;
  }
  .ciudad { font-size: 1.8rem; font-weight: 700; line-height: 1.1; display: flex; flex-direction: column; }
  #ciudadSub { font-size: 0.85rem; font-weight: 400; opacity: 0.65; margin-top: 1px; }
  .top-info {
    text-align: right; font-size: 0.8rem; opacity: 0.85;
    line-height: 1.8; white-space: nowrap; padding-top: 4px;
  }
  .principal {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 4px 0 8px;
  }
  .icono { width: 64px; height: 64px; }
  .icono svg {
    width: 100%; height: 100%; stroke: #fff; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .temp-wrap { position: relative; display: flex; align-items: center; }
  .temp { font-size: 4rem; font-weight: 700; line-height: 1; }
  .temp-minmax {
    position: absolute;
    left: 100%;
    padding-left: 8px;
    font-size: 0.78rem;
    opacity: 0.8;
    display: flex;
    flex-direction: column;
    line-height: 1.5;
    white-space: nowrap;
  }
  .temp-minmax .tmx { font-weight: 600; }
  .temp-minmax .tmn { opacity: 0.75; }
  .desc { font-size: 1rem; opacity: 0.9; margin-bottom: 2px; }
  .lluvia { font-size: 0.78rem; opacity: 0.8; margin-bottom: 4px; min-height: 1em; }
  .aire { font-size: 0.82rem; opacity: 0.85; margin-bottom: 2px; min-height: 1em; }
  .detalles {
    display: flex; justify-content: center; gap: 20px;
    font-size: 0.9rem; opacity: 0.85; margin-bottom: 14px;
  }
  .panel {
    background: rgba(255,255,255,0.12);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
  }
  .panel-interior { display: flex; justify-content: space-around; align-items: center; }
  .panel-interior[hidden] { display: none; }
  .interior-item { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
  .interior-valor { font-size: 1.5rem; font-weight: 600; }
  .interior-label { font-size: 0.65rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; text-align: center; }
  .panel-titulo {
    font-size: 0.72rem; opacity: 0.65;
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
  }
  .marea-extremos { display: flex; justify-content: space-around; margin-bottom: 8px; }
  .marea-extremo { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .marea-extremo .me-icono svg {
    width: 26px; height: 26px; stroke: #fff; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .marea-extremo .me-label { font-size: 0.68rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.04em; }
  .marea-agua { font-size: 0.85rem; opacity: 0.8; text-align: center; margin-top: 6px; }
  .marea-extremo .me-hora { font-size: 0.95rem; font-weight: 600; }
  .marea-extremo .me-altura { font-size: 0.78rem; opacity: 0.8; }
  .marea-estado { font-size: 0.85rem; opacity: 0.9; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 6px; }
  #panelMarea { cursor: pointer; }
  #panelMarea:hover { opacity: 0.85; }
  /* Modal mareas */
  #modalMarea {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
  }
  #modalMarea.abierto { display: flex; }
  .modal-sheet {
    background: rgba(20,30,50,0.97); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px; padding: 20px 18px 32px;
    color: #fff; max-height: 90vh; overflow-y: auto;
  }
  .modal-handle-row {
    display: flex; align-items: center; justify-content: center;
    position: relative; margin-bottom: 16px;
  }
  .modal-handle {
    width: 40px; height: 4px; background: rgba(255,255,255,0.3);
    border-radius: 2px;
  }
  .modal-close {
    position: absolute; right: 0; top: -4px;
    background: rgba(255,255,255,0.12); border: none; color: #fff;
    border-radius: 50%; width: 28px; height: 28px; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  /* Radar */
  #btnRadar {
    display: block; width: 100%; margin-top: 8px;
    background: rgba(255,255,255,0.08); border: none; border-radius: 8px;
    color: #fff; font-size: 0.75rem; padding: 6px 10px; cursor: pointer;
    text-align: center; opacity: 0.7; letter-spacing: 0.04em;
  }
  #btnRadar:hover { opacity: 1; }
  #modalRadar {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
  }
  #modalRadar.abierto { display: flex; }
  #radarSheet {
    background: #0d1b2a; border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px; padding: 16px 16px 32px;
    color: #fff; max-height: 90vh;
  }
  #radarMap { width: 100%; height: 300px; border-radius: 10px; overflow: hidden; margin-top: 8px; }
  #radarTit { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; text-align: center; }
  #radarControls { margin-top: 10px; }
  #radarSlider { width: 100%; accent-color: #4af; cursor: pointer; }
  #radarTimeLabel { text-align: center; font-size: 0.8rem; font-weight: 600; margin-top: 4px; opacity: 0.9; letter-spacing: 0.03em; }
  #radarPlayBtn { display: block; width: 100%; margin-top: 8px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: #fff; font-size: 0.78rem; padding: 6px; cursor: pointer; }
  .radar-nowcast { color: #7dd3fc; }
  .modal-titulo {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
    opacity: 0.6; margin-bottom: 14px; text-align: center;
  }
  #mareaChart { width: 100%; height: 130px; display: block; margin-bottom: 16px; }
  .modal-extremos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
    gap: 10px; margin-top: 4px;
  }
  .modal-extremo {
    background: rgba(255,255,255,0.08); border-radius: 10px;
    padding: 10px 6px; text-align: center;
  }
  .modal-extremo .mex-tipo { font-size: 0.65rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
  .modal-extremo .mex-hora { font-size: 1rem; font-weight: 600; margin: 3px 0; }
  .modal-extremo .mex-alt { font-size: 0.8rem; opacity: 0.8; }
  .horas { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 2px; }
  .horas::-webkit-scrollbar { height: 0; }
  .hora { flex: 0 0 auto; text-align: center; min-width: 46px; }
  .hora .h { font-size: 0.8rem; opacity: 0.75; margin-bottom: 4px; }
  .hora .icono-hora { width: 28px; height: 28px; margin: 0 auto 4px; }
  .hora .icono-hora svg {
    width: 100%; height: 100%; stroke: #fff; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .hora .t { font-size: 0.9rem; font-weight: 600; }
  .hora .p { font-size: 0.75rem; opacity: 0.8; color: #bfe0ff; margin-top: 2px; }
  .dia { flex: 0 0 auto; text-align: center; min-width: 52px; }
  .dia .d { font-size: 0.8rem; opacity: 0.75; margin-bottom: 4px; text-transform: capitalize; }
  .dia .icono-dia { width: 28px; height: 28px; margin: 0 auto 4px; }
  .dia .icono-dia svg {
    width: 100%; height: 100%; stroke: #fff; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .dia .max { font-size: 0.9rem; font-weight: 600; }
  .dia .min { font-size: 0.8rem; opacity: 0.7; }
  .dia-lluvia { font-size: 0.72rem; color: #7dd3fc; opacity: 0.9; margin-top: 2px; }
  .dia { cursor: pointer; transition: opacity 0.15s; }
  .dia:active { opacity: 0.6; }
  /* Modal día */
  #modalInterior {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
  }
  #modalInterior.abierto { display: flex; }
  .interior-item { cursor: pointer; }
  .interior-item:active { opacity: 0.6; }
  #modalDia {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
  }
  #modalDia.abierto { display: flex; }
  #diaNombreFecha { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; margin-bottom: 12px; text-align: center; }
  #diaIconoGrande { width: 56px; height: 56px; margin: 0 auto 8px; }
  #diaIconoGrande svg { width: 100%; height: 100%; stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #diaDesc { text-align: center; font-size: 0.9rem; opacity: 0.85; margin-bottom: 16px; }
  .dia-temps { display: flex; justify-content: center; gap: 18px; margin-bottom: 6px; }
  .dia-clima-normal { text-align: center; font-size: 0.72rem; opacity: 0.5; margin-bottom: 16px; letter-spacing: 0.02em; min-height: 1em; }
  .dia-temp-max { font-size: 2rem; font-weight: 700; }
  .dia-temp-min { font-size: 2rem; font-weight: 400; opacity: 0.55; }
  .dia-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dia-stat { background: rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 10px; text-align: center; }
  .dia-stat-lbl { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.55; margin-bottom: 4px; }
  .dia-stat-val { font-size: 0.95rem; font-weight: 600; }
  #pullIndicator {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%) translateY(-60px);
    background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
    border-radius: 50%; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; z-index: 300;
    transition: transform 0.2s ease, opacity 0.2s ease; opacity: 0;
  }
  #pullIndicator.visible { opacity: 1; }
  #pullIndicator.spinning { animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }
  .bottom-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 4px; gap: 12px;
  }
  button {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4);
    color: #fff; padding: 10px 22px; border-radius: 24px; font-size: 0.95rem; cursor: pointer;
  }
  button:active { background: rgba(255,255,255,0.3); }
  .estado { font-size: 0.8rem; opacity: 0.7; text-align: right; flex: 1; }
  .ad-bottom {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 100; height: 50px;
  }
  .ad-bottom iframe {
    width: 100%; height: 50px; border: none; display: block;
  }

  @media (orientation: landscape) and (max-height: 500px) {
    body { align-items: flex-start; padding: 4px 16px; }
    .card {
      max-width: 100%; padding-top: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto;
      column-gap: 14px;
      align-items: start;
      text-align: center;
    }
    #btnBuscarCiudad { grid-column: 1; grid-row: 1; margin-bottom: 0; }
    .top-row         { grid-column: 1; grid-row: 2; margin-bottom: 4px; }
    .buscador        { grid-column: 1 / 3; grid-row: 3; }
    #principal       { grid-column: 1; grid-row: 4; margin: 0; }
    .desc            { grid-column: 1; grid-row: 5; font-size: 0.78rem; margin-bottom: 2px; }
    .aire            { grid-column: 1; grid-row: 6; font-size: 0.7rem; margin-bottom: 4px; }
    .detalles        { grid-column: 1; grid-row: 7; font-size: 0.78rem; margin-bottom: 4px; gap: 10px; }
    .bottom-row      { grid-column: 1; grid-row: 8; }
    #panelHoras      { grid-column: 2; grid-row: 1 / 5; padding: 8px; margin-bottom: 6px; }
    #panelDias       { grid-column: 2; grid-row: 5 / 9; padding: 8px; }
    #panelMarea      { grid-column: 1 / 3; grid-row: 9; padding: 6px 14px; margin-bottom: 4px; }
    .ciudad { font-size: 1.1rem; }
    .top-info { font-size: 0.68rem; line-height: 1.5; }
    .icono { width: 38px; height: 38px; }
    .temp { font-size: 2.2rem; }
    .panel-titulo { margin-bottom: 4px; }
    .marea-extremos { margin-bottom: 4px; }
    .bottom-row button { padding: 6px 14px; font-size: 0.8rem; }
    .marea-extremo .me-label { font-size: 0.6rem; }
    .marea-extremo .me-icono svg { width: 20px; height: 20px; }
  }
</style>

<body>
  <div id="pullIndicator"></div>
  <div id="bg"></div>
  <div id="swipeClip" style="width:100%;max-width:420px;overflow:hidden">
  <div class="card" id="pageCard">
    <button class="btn-ajustes" id="btnAjustes"></button>
    <button class="btn-ayuda" id="btnAyuda">?</button>
    <div id="ajustesPanel" hidden>
      <div class="ajustes-panel">
        <div class="ajustes-fila">
          <span class="ajustes-label" id="ajustesTempLabel"></span>
          <div class="ajustes-toggle">
            <button id="btnC">°C</button>
            <button id="btnF">°F</button>
          </div>
        </div>
        <div class="ajustes-fila">
          <span class="ajustes-label" id="ajustesVelLabel"></span>
          <div class="ajustes-toggle">
            <button id="btnKmh">km/h</button>
            <button id="btnMph">mph</button>
          </div>
        </div>
        <div class="ajustes-fila">
          <span class="ajustes-label" id="ajustesIdiomaLabel"></span>
          <select id="selectIdioma" class="ajustes-select"></select>

function detectarIdioma() {
  const full = (navigator.language || navigator.userLanguage || 'es').toLowerCase();
  if (full.startsWith('ca')) return 'ca';
  if (full.startsWith('eu')) return 'eu';
  if (full.startsWith('gl')) return 'gl';
  const lang = full.substring(0, 2);
  return TRADUCCIONES[lang] ? lang : 'en';
}

function toTemp(c) {
  return usaFahrenheit ? Math.round(c * 9 / 5 + 32) + '°F' : Math.round(c) + '°';
}
function toAlt(m, decimals = 1) {
  return usaFahrenheit ? (m * 3.28084).toFixed(decimals) + ' ft' : m.toFixed(decimals) + ' m';
}
function toViento(kmh) {
  return (usaMph || usaFahrenheit) ? Math.round(kmh * 0.621371) + ' mph' : Math.round(kmh) + ' km/h';
}
function dirViento(deg) {
  const dirs = ['N','NE','E','SE','S','SO','O','NO'];
  return dirs[Math.round(deg / 45) % 8];
}

}
function renderFavsEnAjustes() {
  const seccion = document.getElementById('ajustesFavsSeccion');
  const lista = document.getElementById('ajustesFavsLista');
  const favs = loadFavoritos();
  if (!favs.length) { seccion.hidden = true; return; }
  seccion.hidden = false;
  lista.innerHTML = favs.map((f, i) => `
    <div class="ajustes-fav-item" data-i="${i}">
      <span class="ajustes-fav-nombre">${f.nombre}</span>
      <button class="ajustes-fav-remove" data-i="${i}" aria-label="Eliminar">✕</button>
    </div>`).join('');
  lista.querySelectorAll('.ajustes-fav-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('ajustes-fav-remove')) return;
      const f = loadFavoritos()[+el.dataset.i];
      if (!f) return;
      ubicacionManual = { lat: f.lat, lon: f.lon, nombre: f.nombre };
      document.getElementById('ajustesPanel').hidden = true;
      cargarDatos(f.lat, f.lon, f.nombre);
    });
  });
  lista.querySelectorAll('.ajustes-fav-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const favs = loadFavoritos();
      favs.splice(+btn.dataset.i, 1);
      saveFavoritos(favs);
      renderFavsEnAjustes();
      renderFavoritosLista();
      actualizarBtnFav();
    });
  });
}

document.getElementById('btnAjustes').addEventListener('click', (e) => {

});

function iconoParaCodigo(codigo, esDia = true) {
  if (codigo === 0) return esDia ? ICONOS.sol : ICONOS.luna;

  if (codigo === 3) return ICONOS.nube;
  if (codigo === 45 || codigo === 48) return ICONOS.niebla;

  if (codigo >= 95) return ICONOS.tormenta;
  return ICONOS.solNube;
}

function colorParaTemp(temp) {
  const rangos = [
    { t: 0,   c1: '#b8d8f0', c2: '#8ab8d8', texto: '#1a3a5c' },
    { t: 10,  c1: '#1e3a5f', c2: '#3a6ea5', texto: '#ffffff' },
    { t: 18,  c1: '#1a4a6e', c2: '#2a7a8a', texto: '#ffffff' },
    { t: 24,  c1: '#1e5c3a', c2: '#2e8a5a', texto: '#ffffff' },
    { t: 30,  c1: '#7a4a10', c2: '#c07020', texto: '#ffffff' },
    { t: 35,  c1: '#8a2a10', c2: '#c04020', texto: '#ffffff' },
    { t: 999, c1: '#6a1010', c2: '#a02020', texto: '#ffffff' },
  ];
  for (let i = 0; i < rangos.length - 1; i++) {
    const a = rangos[i], b = rangos[i + 1];
    if (temp <= a.t || (temp >= a.t && temp < b.t)) {
      if (temp <= a.t) return a;
      const ratio = (temp - a.t) / (b.t - a.t);
      return {
        c1: interpolarColor(a.c1, b.c1, ratio),
        c2: interpolarColor(a.c2, b.c2, ratio),
        texto: ratio < 0.5 ? a.texto : b.texto
      };
    }
  }
  return rangos[rangos.length - 1];
}

function interpolarColor(hex1, hex2, t) {
  const r1 = parseInt(hex1.slice(1,3),16), g1 = parseInt(hex1.slice(3,5),16), b1 = parseInt(hex1.slice(5,7),16);
  const r2 = parseInt(hex2.slice(1,3),16), g2 = parseInt(hex2.slice(3,5),16), b2 = parseInt(hex2.slice(5,7),16);
  const r = Math.round(r1+(r2-r1)*t), g = Math.round(g1+(g2-g1)*t), b = Math.round(b1+(b2-b1)*t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function aplicarColorTemp(temp) {
  const col = colorParaTemp(temp);
  document.getElementById('bg').style.background = `linear-gradient(160deg, ${col.c1}, ${col.c2})`;
  document.body.style.color = col.texto;

}

let _aemetMunicipiosCache = null; // caché en memoria para la sesión

async function obtenerMunicipioAEMET(lat, lon) {
  // Busca el municipio AEMET más cercano — la lista se cachea en memoria
  if (!_aemetMunicipiosCache) {
    const url = `https://opendata.aemet.es/opendata/api/maestro/municipios?api_key=${AEMET_KEY}`;
    const r1 = await fetch(url);
    if (!r1.ok) return null;
    const j1 = await r1.json();
    if (j1.estado !== 200 || !j1.datos) return null;
    const r2 = await fetch(j1.datos);
    if (!r2.ok) return null;
    _aemetMunicipiosCache = await r2.json();
  }
  const municipios = _aemetMunicipiosCache;
  // Encontrar el más cercano por distancia euclídea (suficiente para esto)
  let mejor = null, mejorDist = Infinity;
  for (const m of municipios) {
    const mlat = parseFloat(m.latitud_dec);
    const mlon = parseFloat(m.longitud_dec);
    if (isNaN(mlat) || isNaN(mlon)) continue;
    const d = Math.pow(mlat - lat, 2) + Math.pow(mlon - lon, 2);
    if (d < mejorDist) { mejorDist = d; mejor = m; }
  }
  return mejor ? mejor.id : null; // id tipo "id33024"
}

function aemetCodigoAWMO(skyCode) {
  // Convierte el código de cielo de AEMET a código WMO aproximado
  // Códigos AEMET: 11=despejado, 12=poco nuboso, 13=intervalos nubosos,
  // 14=nuboso, 15=muy nuboso, 16=cubierto, 17=nubes altas,
  // 23=intervalos nubosos con lluvia, 24=nuboso con lluvia, 25=muy nuboso con lluvia,
  // 26=cubierto con lluvia, 33=intervalos nubosos con nieve, 34=nuboso con nieve,
  // 43=intervalos nubosos con lluvia y nieve, 44=nuboso con lluvia y nieve,
  // 51=intervalos nubosos con tormenta, 52=nuboso con tormenta, 53=muy nuboso con tormenta, 54=cubierto con tormenta
  const c = parseInt(skyCode);
  if (c === 11) return 0;
  if (c === 12) return 1;
  if (c === 13) return 2;
  if (c === 14 || c === 15 || c === 17) return 2;
  if (c === 16) return 3;
  if (c >= 23 && c <= 26) return 61;
  if (c >= 33 && c <= 36) return 71;
  if (c >= 43 && c <= 46) return 61;
  if (c >= 51 && c <= 54) return 95;
  if (c >= 61 && c <= 64) return 51; // llovizna
  if (c >= 71 && c <= 74) return 71; // nieve débil
  return 3; // por defecto nublado
}

function aemetDatosActuales(aemetData) {
  // Extrae los datos de la hora más cercana del JSON de AEMET
  if (!aemetData || !aemetData.prediccion || !aemetData.prediccion.dia) return null;
  const ahora = new Date();
  const horaActual = ahora.getHours();
  // Buscar el día de hoy
  const hoy = ahora.toISOString().slice(0, 10);
  let diaData = aemetData.prediccion.dia.find(d => d.fecha && d.fecha.startsWith(hoy));
  if (!diaData) diaData = aemetData.prediccion.dia[0];
  if (!diaData) return null;

  // Función para buscar el valor de la hora más cercana en un array de periodos
  function valorHora(arr, campo) {
    if (!arr || !arr.length) return null;
    // Periodos pueden ser objetos con atributo "periodo" o "hora"
    let mejor = null, mejorDif = Infinity;
    for (const item of arr) {
      const p = parseInt(item.periodo || item.hora || '0');
      const dif = Math.abs(p - horaActual);
      if (dif < mejorDif) { mejorDif = dif; mejor = item; }
    }
    return mejor ? (campo ? mejor[campo] : mejor.value ?? mejor.descripcion) : null;
  }

  const cielo = valorHora(diaData.estadoCielo, 'value');
  const prob = valorHora(diaData.probPrecipitacion);
  const temp = valorHora(diaData.temperatura);
  const viento = valorHora(diaData.viento, 'velocidad');

  return {
    weatherCode: cielo ? aemetCodigoAWMO(cielo) : null,
    probPrecip: prob !== null ? parseInt(prob) : null,
    temperatura: temp !== null ? parseFloat(temp) : null,
    viento: viento !== null ? parseFloat(viento) : null,
  };
}

function esNWS(lat, lon) {
  // Cobertura aproximada de NWS: EEUU continental, Alaska, Hawaii, Puerto Rico
  if (lat >= 24 && lat <= 50 && lon >= -125 && lon <= -66) return true;  // EEUU continental
  if (lat >= 51 && lat <= 72 && lon >= -170 && lon <= -130) return true; // Alaska
  if (lat >= 18 && lat <= 23 && lon >= -161 && lon <= -154) return true; // Hawaii
  if (lat >= 17 && lat <= 19 && lon >= -68 && lon <= -65) return true;   // Puerto Rico
  return false;
}

function nwsForecastAWMO(shortForecast, prob) {
  const f = (shortForecast || '').toLowerCase();
  if (f.includes('thunderstorm')) return 95;
  if (f.includes('blizzard') || f.includes('heavy snow')) return 75;
  if (f.includes('snow') || f.includes('flurries')) return 71;
  if (f.includes('sleet') || f.includes('freezing rain') || f.includes('wintry mix')) return 67;
  if (f.includes('heavy rain') || f.includes('heavy shower')) return 65;
  if (f.includes('rain') || f.includes('shower')) {
    if (prob !== null && prob >= 50) return 61;
    return 51;
  }
  if (f.includes('drizzle')) return 51;
  if (f.includes('fog') || f.includes('mist')) return 45;
  if (f.includes('overcast') || f.includes('cloudy')) return 3;
  if (f.includes('mostly cloudy') || f.includes('partly cloudy')) return 2;
  if (f.includes('mostly sunny') || f.includes('partly sunny')) return 1;
  if (f.includes('sunny') || f.includes('clear')) return 0;
  return 3;
}

async function obtenerTiempoNWS(lat, lon) {
  // Paso 1: obtener URLs de predicción
  const r1 = await fetch(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`, {
    headers: { 'User-Agent': 'QuickTemp/1.8 (diegohg72@gmail.com)' }
  });
  if (!r1.ok) return null;
  const j1 = await r1.json();
  const hourlyUrl = j1.properties && j1.properties.forecastHourly;
  if (!hourlyUrl) return null;

  // Paso 2: obtener predicción horaria
  const r2 = await fetch(hourlyUrl, {
    headers: { 'User-Agent': 'QuickTemp/1.8 (diegohg72@gmail.com)' }
  });
  if (!r2.ok) return null;
  const j2 = await r2.json();
  const periods = j2.properties && j2.properties.periods;
  if (!periods || !periods.length) return null;

  // El primer periodo es la hora actual
  const now = periods[0];
  const prob = now.probabilityOfPrecipitation && now.probabilityOfPrecipitation.value !== null
    ? now.probabilityOfPrecipitation.value : null;
  const tempF = now.temperature; // NWS siempre devuelve °F
  const tempC = (tempF - 32) * 5 / 9;
  const windStr = now.windSpeed || ''; // "3 mph"
  const windKmh = parseFloat(windStr) * 1.60934 || null;

  return {
    weatherCode: nwsForecastAWMO(now.shortForecast, prob),
    probPrecip: prob,
    temperatura: tempC,
    viento: windKmh,
    isDay: now.isDaytime,
    shortForecast: now.shortForecast,
  };
}

async function obtenerTiempo(lat, lon) {
  // ICON seamless: mejor nubosidad local. UV se pide aparte (ICON no lo incluye).
  const [r, rUv] = await Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,precipitation&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant,precipitation_sum&forecast_days=7&timezone=auto&minutely_15=weather_code,is_day&models=icon_seamless`),
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=uv_index&daily=uv_index_max&forecast_days=7&timezone=auto`)
  ]);
  if (!r.ok) throw new Error('Error al consultar el tiempo');
  const uvJson = rUv.ok ? await rUv.json() : null;
  const _mergeUv = (data) => {
    if (!uvJson) return data;
    if (uvJson.current) data.current.uv_index = uvJson.current.uv_index;
    if (uvJson.daily && data.daily) data.daily.uv_index_max = uvJson.daily.uv_index_max;
    return data;
  };
  const data = await r.json();
  return _mergeUv(data);
}

function renderHoras(hourly) {
  elHoras.innerHTML = '';
  if (!hourly || !hourly.time) return;

function codigoSinLluvia(code, prob) {
  if (prob > 0) return code;
  const esLluvia = (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 85 && code <= 86) || (code >= 95 && code <= 99);
  return esLluvia ? 3 : code;
}

const UMBRAL_LLOVIZNA = 30; // % a partir del cual forzar icono de llovizna
const UMBRAL_LLUVIA = 50;   // % a partir del cual forzar icono de lluvia

function iconoConProb(code, prob, esDia = true) {
  // El icono de precipitación siempre depende de la probabilidad,
  // independientemente de lo que diga el código WMO
  const p = prob ?? 0;
  const esTormenta = (code >= 95);
  if (esTormenta) return iconoParaCodigo(code, esDia); // tormenta siempre se respeta
  if (p >= UMBRAL_LLUVIA) return iconoParaCodigo(61, esDia);    // >=50% → lluvia
  if (p >= UMBRAL_LLOVIZNA) return iconoParaCodigo(51, esDia);  // >=30% → llovizna
  return iconoParaCodigo(codigoSinLluvia(code, p), esDia);      // <30% → sin lluvia
}

// Media histórica de temperatura para una fecha
const _climaCache = {};
async function fetchClimaNormal(lat, lon, month, day) {
  const anioFin = new Date().getFullYear() - 1;
  const anioIni = anioFin - 29;
  const key = `${lat.toFixed(2)},${lon.toFixed(2)},${month},${day},${anioIni}`;
  if (_climaCache[key]) return _climaCache[key];
  const mm = String(month).padStart(2, '0');
  const dd = String(day).padStart(2, '0');
  const anioActual = new Date().getFullYear();
  const anios = [];
  for (let y = anioActual - 30; y < anioActual; y++) anios.push(y);
  const fetches = anios.map(y =>
    fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${y}-${mm}-${dd}&end_date=${y}-${mm}-${dd}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`)
      .then(r => r.ok ? r.json() : null).catch(() => null)
  );
  const resultados = await Promise.all(fetches);
  const maxVals = [], minVals = [];
  for (const r of resultados) {
    if (r && r.daily && r.daily.temperature_2m_max && r.daily.temperature_2m_max[0] != null) {
      maxVals.push(r.daily.temperature_2m_max[0]);
      minVals.push(r.daily.temperature_2m_min[0]);
    }
  }
  if (!maxVals.length) return null;
  const avg = arr => Math.round(arr.reduce((s, v) => s + v, 0) / arr.length);
  const result = { max: avg(maxVals), min: avg(minVals), años: maxVals.length };
  _climaCache[key] = result;
  return result;
}

async function obtenerMarea(lat, lon) {
  const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=sea_level_height_msl,sea_surface_temperature,wave_height&forecast_days=2&timezone=auto`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('No es costero');
  const data = await r.json();
  const tiempos = data.hourly && data.hourly.time;
  const alturas = data.hourly && data.hourly.sea_level_height_msl;
  const tempAguas = data.hourly && data.hourly.sea_surface_temperature;
  const waveHeights = data.hourly && data.hourly.wave_height;
  if (!tiempos || !alturas || !alturas.some(h => h !== null)) return null;

  const ahora = Date.now();
  const hoy = new Date().toDateString();

  // Find today's extremes
  const extremos = [];
  for (let i = 1; i < alturas.length - 1; i++) {
    if (alturas[i] === null || alturas[i-1] === null || alturas[i+1] === null) continue;
    const subeBefore = alturas[i] > alturas[i-1];
    const subeAfter = alturas[i+1] > alturas[i];
    if (subeBefore === subeAfter) continue;

    let horaMs = new Date(tiempos[i]).getTime();
    let altura = alturas[i];
    const h0 = alturas[i-1], h1 = alturas[i], h2 = alturas[i+1];
    const den = h0 - 2*h1 + h2;
    if (den !== 0) {
      const offset = 0.5*(h0-h2)/den;
      if (offset > -1 && offset < 1) {
        horaMs += offset * 3600000;
        altura = h1 - (h0-h2)*(h0-h2)/(8*den);
      }
    }
    const manana6 = new Date(); manana6.setDate(manana6.getDate() + 1); manana6.setHours(6, 0, 0, 0);
    if (horaMs > manana6.getTime()) continue;
    extremos.push({ hora: horaMs, altura: Math.max(0, altura), tipo: subeBefore ? 'pleamar' : 'bajamar' });
  }

  // Current state
  let idx = tiempos.findIndex(t => new Date(t).getTime() >= ahora);
  if (idx < 0) idx = tiempos.length - 2;
  if (idx >= alturas.length - 1) idx = alturas.length - 2;
  const subiendo = alturas[idx+1] > alturas[idx];

  // Next extreme
  let k = idx + 1;
  while (k < alturas.length - 1) {
    if ((alturas[k+1] > alturas[k]) !== (alturas[k] > alturas[k-1])) break;
    k++;
  }
  let horaNext = new Date(tiempos[Math.min(k, tiempos.length-1)]).getTime();
  if (k > 0 && k < alturas.length - 1) {
    const h0 = alturas[k-1], h1 = alturas[k], h2 = alturas[k+1];
    const den = h0 - 2*h1 + h2;
    if (den !== 0) {
      const offset = 0.5*(h0-h2)/den;
      if (offset > -1 && offset < 1) horaNext += offset*3600000;
    }
  }
  const estadoTexto = null; // se computa en renderMarea con T actual

  // Current sea surface temperature (closest non-null value to now)
  let tempAgua = null;
  if (tempAguas) {
    let bestIdx = idx;
    for (let d = 0; d < tempAguas.length; d++) {
      const i1 = Math.max(0, idx - d), i2 = Math.min(tempAguas.length - 1, idx + d);
      if (tempAguas[i1] !== null) { bestIdx = i1; break; }
      if (tempAguas[i2] !== null) { bestIdx = i2; break; }
    }
    if (tempAguas[bestIdx] !== null) tempAgua = Math.round(tempAguas[bestIdx]);
  }

  let waveHeight = null;
  if (waveHeights) {
    for (let d = 0; d < waveHeights.length; d++) {
      const i1 = Math.max(0, idx - d), i2 = Math.min(waveHeights.length - 1, idx + d);
      if (waveHeights[i1] !== null) { waveHeight = waveHeights[i1]; break; }
      if (waveHeights[i2] !== null) { waveHeight = waveHeights[i2]; break; }
    }
  }

  return { extremos, subiendo, horaNext, tempAgua, waveHeight, tiempos, alturas };
}

function renderMarea(datos) {
  const panel = document.getElementById('panelMarea');
  const estadoTexto = datos && datos.horaNext != null
    ? (datos.subiendo ? `${T.mareaSubiendo} ` : `${T.mareaBajando} `) + new Date(datos.horaNext).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' })
    : null;
  if (!datos || (!datos.extremos.length && !estadoTexto)) {
    panel.hidden = true;
    return false;
  }
  panel.hidden = false;
  document.getElementById('titMarea').textContent = T.mareasDeHoy;

  const elExtremos = document.getElementById('mareaExtremos');
  elExtremos.innerHTML = datos.extremos.map(e => {
    const hora = new Date(e.hora).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
    const label = e.tipo === 'pleamar' ? T.pleamar : T.bajamar;
    const icono = e.tipo === 'pleamar' ? ICONO_PLEAMAR : ICONO_BAJAMAR;
    return `<div class="marea-extremo">
      <div class="me-icono">${icono}</div>
      <div class="me-label">${label}</div>
      <div class="me-hora">${hora}</div>
      <div class="me-altura">${toAlt(e.altura)}</div>
    </div>`;
  }).join('');

  document.getElementById('marea').textContent = estadoTexto || '';
  const elAgua = document.getElementById('mareaAgua');
  const partes = [];
  if (datos.tempAgua !== null && datos.tempAgua !== undefined) partes.push(`🌊 ${toTemp(datos.tempAgua)}`);
  if (datos.waveHeight !== null && datos.waveHeight !== undefined) partes.push(`${T.olas} ${toAlt(datos.waveHeight)}`);
  elAgua.textContent = partes.join('  ');
  return true;
}

function corregirHoraLocal(isoStr, locationUTCOffsetSec) {
  if (!isoStr) return null;
  const parsed = new Date(isoStr).getTime();
  const deviceOffsetSec = -new Date().getTimezoneOffset() * 60;
  return new Date(parsed + (deviceOffsetSec - locationUTCOffsetSec) * 1000);
}

    const now = new Date();
    const idx = m15.time.reduce((best, t, i) => new Date(t) <= now ? i : best, 0);
    if (idx >= 0) { weatherCode = m15.weather_code[idx]; isDay = m15.is_day ? m15.is_day[idx] === 1 : isDay; }
  }

  const cloudCover = owmClouds !== null ? owmClouds : Math.max(c.cloud_cover ?? 0, c.cloud_cover_low ?? 0, c.cloud_cover_mid ?? 0, c.cloud_cover_high ?? 0);
  if (owmId !== null) {
    if (owmId >= 200 && owmId < 300 && weatherCode < 95) weatherCode = 95;        // tormenta
    else if (owmId >= 300 && owmId < 400 && weatherCode < 51) weatherCode = 51;   // llovizna
    else if (owmId >= 500 && owmId < 600 && weatherCode < 61) {
      if (owmId === 500) weatherCode = 61;
      else if (owmId === 501) weatherCode = 63;
      else weatherCode = 65;
    }
    else if (owmId >= 600 && owmId < 700 && weatherCode < 71) weatherCode = 71;   // nieve
    else if (owmId >= 700 && owmId < 800 && weatherCode < 45) weatherCode = 45;   // niebla
  }
  // Si hay precipitación real ahora mismo y el código no lo refleja, forzar llovizna
  const precipActual = c.precipitation ?? 0;
  if (precipActual > 0 && weatherCode < 51) weatherCode = 51;
  if (weatherCode <= 1 && cloudCover >= 75) weatherCode = 3;
  else if (weatherCode <= 1 && cloudCover >= 50) weatherCode = 2;
  elTemp.textContent = toTemp(c.temperature_2m);

  elIcono.innerHTML = iconoParaCodigo(weatherCode, isDay);
  const elLluvia = document.getElementById('lluvia');
  const hourly = tiempo.hourly;
  if (hourly && hourly.time && hourly.precipitation_probability) {

    const prob = idx >= 0 ? hourly.precipitation_probability[idx] : null;
    elLluvia.textContent = prob !== null ? `🌧 ${T.probLluvia || 'Rain probability next hour'}: ${prob}%` : '';
  } else {

  }
  renderHoras(tiempo.hourly);
  renderSol(tiempo.daily);

  const tieneMarea = renderMarea(mdata);
  renderPanelInterior(c.uv_index, aireData, tiempo.daily && tiempo.daily.sunset ? tiempo.daily.sunset[0] : null, tieneMarea, tiempo.utc_offset_seconds, tiempo.daily && tiempo.daily.sunrise ? tiempo.daily.sunrise[0] : null, c.is_day === 1);
  aplicarColorTemp(Math.round(c.temperature_2m));
  const max0 = tiempo.daily && tiempo.daily.temperature_2m_max ? tiempo.daily.temperature_2m_max[0] : null;
  const min0 = tiempo.daily && tiempo.daily.temperature_2m_min ? tiempo.daily.temperature_2m_min[0] : null;
  const elMinMax = document.getElementById('tempMinMax');
  if (max0 !== null && min0 !== null) {

  }
  elSensacion.textContent = T.sensacion + ' ' + toTemp(c.apparent_temperature);
  elViento.textContent = toViento(c.wind_speed_10m);
  elHumedad.textContent = c.relative_humidity_2m + T.humedad;
  const alt = elevacion && elevacion.elevation && elevacion.elevation[0];

  document.getElementById('aire').textContent = aireData ? (aireData.nivelTexto ? (aireData.nivelTexto[idioma] || aireData.nivelTexto['en']) : aireData.texto) : '';
  animarSwipeEntrada();
}

async function cargarDatos(latitude, longitude, nombreFijo) {
  setEstado(T.consultando);
  try {
    // APIs regionales en paralelo según ubicación
    const enEspaña = esEspaña(latitude, longitude);
    const enNWS = !enEspaña && esNWS(latitude, longitude);

    const aemetPromise = enEspaña
      ? obtenerMunicipioAEMET(latitude, longitude)
          .then(cod => cod ? obtenerTiempoAEMET(cod) : null)
          .catch(() => null)
      : Promise.resolve(null);

    const nwsPromise = enNWS
      ? obtenerTiempoNWS(latitude, longitude).catch(() => null)
      : Promise.resolve(null);

    const [tiempo, ciudad, mdata, elevacion, aireData, owmData, aemetRaw, nwsActual] = await Promise.all([
      obtenerTiempo(latitude, longitude),
      nombreFijo ? Promise.resolve({ principal: nombreFijo, sub: null }) : obtenerCiudad(latitude, longitude),
      obtenerMarea(latitude, longitude).catch(() => null),
      fetch(`https://api.open-meteo.com/v1/elevation?latitude=${latitude}&longitude=${longitude}`).then(r => r.json()).catch(() => null),
      obtenerCalidadAire(latitude, longitude).catch(() => null),
      fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=ee01a14dca6430b5ddb8b0fed708d4ba`).then(r => r.json()).catch(() => null),
      aemetPromise,
      nwsPromise
    ]);
    const aemetActual = aemetRaw ? aemetDatosActuales(aemetRaw) : null;
    elCiudad.firstChild.textContent = ciudad.principal;
    document.getElementById('ciudadSub').textContent = ciudad.sub || '';
    const nombreCiudad = ciudad.sub ? `${ciudad.principal}, ${ciudad.sub}` : ciudad.principal;
    currentCoords = { lat: latitude, lon: longitude, nombre: nombreCiudad };
    actualizarBtnFav();
    actualizarFavIdx();
    ultimosDatos = { tiempo, ciudad, mdata, elevacion, aireData, owmData, aemetActual, nwsActual };
    renderDatos(ultimosDatos);
    ultimaActualizacion = Date.now();
    setEstado(T.actualizado + ' ' + new Date(ultimaActualizacion).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' }));
    localStorage.setItem('ql_ultima_act', Date.now().toString());
if (window.ayudaCerrarAlCargar) { window.ayudaCerrarAlCargar(); window.ayudaCerrarAlCargar = null; }
    if (window.ocultarPermisoDenegado) window.ocultarPermisoDenegado();
  } catch (e) {
    setEstado(T.errorTemperatura);
  }
}

async function actualizar() {
  if (_bienvenidaActiva) return;
  setEstado(T.localizando);
  elTemp.textContent = '--°';
  elDesc.textContent = '';
  if (ubicacionManual) {
    cargarDatos(ubicacionManual.lat, ubicacionManual.lon, ubicacionManual.nombre);
    return;
  }
  if (!navigator.geolocation) {
    setEstado(T.geoNoDisponible);
    return;
  }
  // Alta precisión (GPS real, inmune a VPN) con timeout generoso
  // En arranque en frío Android el GPS puede tardar 15-20s
  navigator.geolocation.getCurrentPosition((pos) => {
    cargarDatos(pos.coords.latitude, pos.coords.longitude);
  }, (err) => {
    if (err.code === err.PERMISSION_DENIED) {
      if (window.mostrarPermisoDenegado) window.mostrarPermisoDenegado();
      else setEstado(T.permisoDenegado);
    } else {
      setEstado(T.errorUbicacion);
    }
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 120000 });
}

// Pull-to-refresh
(function() {
  const indicator = document.getElementById('pullIndicator');
  indicator.textContent = '↓';
  let startY = 0, pulling = false, triggered = false;
  const THRESHOLD = 80;

  document.addEventListener('touchstart', e => {
    if (window.scrollY === 0 && e.touches.length === 1) {
      startY = e.touches[0].clientY;
      pulling = true;
      triggered = false;
    }
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { pulling = false; return; }
    const progress = Math.min(dy / THRESHOLD, 1);
    const translateY = Math.min(dy * 0.4, 52);
    indicator.style.transform = `translateX(-50%) translateY(${translateY - 60}px) rotate(${progress * 180}deg)`;
    indicator.classList.toggle('visible', dy > 10);
    triggered = dy >= THRESHOLD;
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (!pulling) return;
    pulling = false;
    if (triggered) {
      indicator.textContent = '↻';
      indicator.classList.add('spinning');
      indicator.style.transform = 'translateX(-50%) translateY(-8px)';
      actualizar().finally(() => {
        indicator.classList.remove('spinning', 'visible');
        indicator.textContent = '↓';
        indicator.style.transform = 'translateX(-50%) translateY(-60px)';
      });
    } else {
      indicator.classList.remove('visible');
      indicator.style.transform = 'translateX(-50%) translateY(-60px)';
    }
  }, { passive: true });
})();

let _radarFrames = [];
let _radarLayer = null;

let _radarPlayInterval = null;

async function crearMapaRadar() {
  const lat = currentCoords ? currentCoords.lat : 43.5;
  const lon = currentCoords ? currentCoords.lon : -5.7;

  radarMap = L.map('radarMap', { zoomControl: true, attributionControl: false }).setView([lat, lon], 6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(radarMap);
  L.circleMarker([lat, lon], { radius: 7, color: '#fff', fillColor: '#4af', fillOpacity: 1, weight: 2 }).addTo(radarMap);
  setTimeout(() => radarMap.invalidateSize(), 100);

  // Frames pasados: RainViewer
  let pastFrames = [];
  try {
    const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    const data = await res.json();
    const past = (data.radar && data.radar.past) || [];
    pastFrames = past.map(f => ({
      url: `https://tilecache.rainviewer.com${f.path}/256/{z}/{x}/{y}/2/1_1.png`,
      time: f.time * 1000,
      tipo: 'past',
      maxNativeZoom: 6
    }));
  } catch(e) {}

  // Frames futuros: RainViewer nowcast (30-120 min según zona)
  let nowcastFrames = [];
  try {
    const res2 = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    const data2 = await res2.json();
    nowcastFrames = ((data2.radar && data2.radar.nowcast) || []).map(f => ({
      url: `https://tilecache.rainviewer.com${f.path}/256/{z}/{x}/{y}/2/1_1.png`,
      time: f.time * 1000,
      tipo: 'nowcast',
      maxNativeZoom: 6
    }));
  } catch(e) {}

  _radarFrames = [...pastFrames, ...nowcastFrames];
  if (!_radarFrames.length) return;

  const slider = document.getElementById('radarSlider');
  slider.max = _radarFrames.length - 1;
  const lastPastIdx = pastFrames.length - 1;
  slider.value = lastPastIdx;
  _radarIdx = lastPastIdx;
  radarSetFrame(_radarIdx);

  slider.oninput = () => {
    _radarIdx = parseInt(slider.value);
    radarSetFrame(_radarIdx);
    radarStopPlay();
  };

  const playBtn = document.getElementById('radarPlayBtn');
  playBtn.onclick = () => {
    if (_radarPlayInterval) { radarStopPlay(); return; }
    playBtn.textContent = '⏹';
    _radarPlayInterval = setInterval(() => {
      _radarIdx = (_radarIdx + 1) % _radarFrames.length;
      slider.value = _radarIdx;
      radarSetFrame(_radarIdx);
    }, 700);
  };
}

function radarSetFrame(idx) {
  const frame = _radarFrames[idx];
  if (!frame || !radarMap) return;
  if (_radarLayer) radarMap.removeLayer(_radarLayer);
  _radarLayer = L.tileLayer(frame.url, {
    opacity: 0.6, maxZoom: 19, maxNativeZoom: frame.maxNativeZoom
  }).addTo(radarMap);

  const d = new Date(frame.time);
  const hora = d.toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
  const lbl = document.getElementById('radarTimeLabel');
  lbl.innerHTML = frame.tipo === 'nowcast'
    ? `<span class="radar-nowcast">▶ ${hora} (predicción)</span>`
    : hora;
}

function radarStopPlay() {
  clearInterval(_radarPlayInterval);
  _radarPlayInterval = null;
  const playBtn = document.getElementById('radarPlayBtn');
  if (playBtn) playBtn.textContent = '▶';
}

  // Now marker

  svgEl.innerHTML = svg;
  _scrubData = { slice, minT, rangeT, minH, rangeH, W, H, PAD };

  const handleScrub = (clientX) => {
    if (!_scrubData) return;
    const rect = svgEl.getBoundingClientRect();
    const svgX = Math.max(PAD, Math.min(W - PAD, ((clientX - rect.left) / rect.width) * W));
    const { slice, minT, rangeT, minH, rangeH } = _scrubData;
    const t = minT + ((svgX - PAD) / (W - 2 * PAD)) * rangeT;
    let h = slice[slice.length - 1].h;
    for (let i = 1; i < slice.length; i++) {
      if (t <= slice[i].t) {
        const r = (t - slice[i-1].t) / (slice[i].t - slice[i-1].t);
        h = slice[i-1].h + r * (slice[i].h - slice[i-1].h);
        break;
      }
    }
    const dotY = (H - PAD) - ((h - minH) / rangeH) * (H - 2 * PAD);
    const hora = new Date(t).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
    const txt = `${hora}  ${toAlt(h)}`;
    const lblW = txt.length * 5.5 + 8;
    const lblX = svgX + 6 + lblW > W - PAD ? svgX - 6 - lblW : svgX + 6;
    const lblY = Math.max(4, dotY - 22);
    document.getElementById('mScrubLine').setAttribute('x1', svgX);
    document.getElementById('mScrubLine').setAttribute('x2', svgX);
    document.getElementById('mScrubLine').setAttribute('visibility', 'visible');
    document.getElementById('mScrubDot').setAttribute('cx', svgX);
    document.getElementById('mScrubDot').setAttribute('cy', dotY);
    document.getElementById('mScrubDot').setAttribute('visibility', 'visible');
    document.getElementById('mScrubBg').setAttribute('visibility', 'visible');
    document.getElementById('mScrubTxt').setAttribute('visibility', 'visible');
    document.getElementById('mScrubBg').setAttribute('x', lblX);
    document.getElementById('mScrubBg').setAttribute('y', lblY);
    document.getElementById('mScrubBg').setAttribute('width', lblW);
    document.getElementById('mScrubTxt').setAttribute('x', lblX + lblW / 2);
    document.getElementById('mScrubTxt').setAttribute('y', lblY + 11);
    document.getElementById('mScrubTxt').textContent = txt;
  };

  const hideScrub = () => {
    document.getElementById('mScrubLine').setAttribute('visibility', 'hidden');
    document.getElementById('mScrubDot').setAttribute('visibility', 'hidden');
    document.getElementById('mScrubBg').setAttribute('visibility', 'hidden');
    document.getElementById('mScrubTxt').setAttribute('visibility', 'hidden');
  };

  svgEl.onmousemove = e => handleScrub(e.clientX);
  svgEl.onmouseleave = hideScrub;
  svgEl.ontouchstart = e => handleScrub(e.touches[0].clientX);
  svgEl.ontouchmove = e => handleScrub(e.touches[0].clientX);
  svgEl.ontouchend = hideScrub;
}

function renderModalMareaExtremost(mdata) {

  const visibles = [...pasados.slice(-1), ...futuros.slice(0, 2)];
  el.innerHTML = visibles.map(e => {

    const label = e.tipo === 'pleamar' ? (T.pleamar || 'Pleamar') : (T.bajamar || 'Bajamar');

      <div class="mex-hora">${hora}</div>

// ── Swipe entre GPS + favoritas ────────────────────────────────────
// swipePos: -1 = GPS, 0..n-1 = favorita[i]
let currentFavIdx = -1;

const GPS_DOT = `<svg width="10" height="13" viewBox="0 0 10 13" style="display:inline-block;vertical-align:middle"><circle cx="5" cy="5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="5" y1="8.2" x2="5" y2="12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;

function renderSwipeDots() {
  const favs = loadFavoritos();
  const container = document.getElementById('swipeDots');
  if (!container) return;
  if (!favs.length) { container.innerHTML = ''; return; }
  // posición activa: -1→dot índice 0 (GPS), favIdx→dot índice favIdx+1
  const activePos = currentFavIdx === -1 ? 0 : currentFavIdx + 1;
  const total = favs.length + 1;
  container.innerHTML = Array.from({ length: total }, (_, i) => {
    const activo = i === activePos;
    if (i === 0) {
      return `<span style="display:inline-flex;align-items:center;opacity:${activo?'1':'0.3'};transition:opacity 0.3s;transform:scale(${activo?'1.15':'1'});transition:all 0.3s">${GPS_DOT}</span>`;
    }
    return `<span style="width:${activo?'18px':'6px'};height:6px;border-radius:3px;background:currentColor;opacity:${activo?'0.9':'0.3'};transition:all 0.3s;display:inline-block"></span>`;
  }).join('');
}

function irAPosicion(pos) {
  const favs = loadFavoritos();
  const total = favs.length + 1;
  pos = ((pos % total) + total) % total;
  const dir = pos > (currentFavIdx + 1) ? 'left' : 'right';
  if (pos === 0) {
    currentFavIdx = -1;
    ubicacionManual = null;
    animarSwipe(dir);
    renderSwipeDots();
    actualizar();
  } else {
    const f = favs[pos - 1];
    currentFavIdx = pos - 1;
    ubicacionManual = { lat: f.lat, lon: f.lon, nombre: f.nombre };
    animarSwipe(dir);
    renderSwipeDots();
    cargarDatos(f.lat, f.lon, f.nombre);
  }
}

function actualizarFavIdx() {
  if (!currentCoords) return;
  if (!ubicacionManual) {
    currentFavIdx = -1;
  } else {
    const favs = loadFavoritos();
    currentFavIdx = favs.findIndex(f => Math.abs(f.lat - currentCoords.lat) < 0.01 && Math.abs(f.lon - currentCoords.lon) < 0.01);
  }
  renderSwipeDots();
}

(function initSwipe() {
  let tx = 0, ty = 0, swiping = false;

  function enScrollHorizontal(el) {
    while (el && el !== document.body) {
      const st = window.getComputedStyle(el);
      const ox = st.overflowX;
      if ((ox === 'auto' || ox === 'scroll') && el.scrollWidth > el.clientWidth + 2) return true;
      el = el.parentElement;
    }
    return false;
  }

  document.body.addEventListener('touchstart', e => {
    if (!loadFavoritos().length) return;
    if (enScrollHorizontal(e.target)) { swiping = false; return; }
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    swiping = true;
  }, { passive: true });
  document.body.addEventListener('touchend', e => {
    if (!swiping) return;
    swiping = false;
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const posActual = currentFavIdx === -1 ? 0 : currentFavIdx + 1;
    irAPosicion(dx < 0 ? posActual + 1 : posActual - 1);
  }, { passive: true });
})();

// ── Velocímetro ──────────────────────────────────────────────────────────────
(function() {
  const UMBRAL_MS = 0.6; // ~2 km/h, por debajo se considera parado
  const MAX_VEL = 180;   // km/h para escala del arco (o 110 mph)
  let velActual = 0, velMax = 0, velSuma = 0, velCount = 0;
  let watchId = null;
  let distMetros = 0, lastLat = null, lastLon = null;

  function haversineM(lat1, lon1, lat2, lon2) {
    const R = 6371000, r = Math.PI / 180;
    const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function formatDist(m) {
    const usaMph = window.usaMph || false;
    if (usaMph) {
      const miles = m / 1609.34;
      return miles < 0.1 ? [Math.round(m * 3.28084) + '', 'ft'] : [miles.toFixed(2), 'mi'];
    }
    return m < 1000 ? [Math.round(m) + '', 'm'] : [(m / 1000).toFixed(2), 'km'];
  }

  function actualizarPanelBrujula() {
    const T = window.T || {};
    const velLabel = document.getElementById('brjVelLabel');
    const velNum   = document.getElementById('brjVelNum');
    const velUnit  = document.getElementById('brjVelUnit');
    const distLabel = document.getElementById('brjDistLabel');
    const distNum  = document.getElementById('brjDistNum');
    const distUnit = document.getElementById('brjDistUnit');
    const resetBtn = document.getElementById('brjDistReset');
    if (velLabel) velLabel.textContent = T.tuVelocidad || 'Velocidad';
    if (distLabel) distLabel.textContent = T.distancia || 'Distancia';
    if (resetBtn) resetBtn.textContent = T.resetDist || 'Reset';
    if (velNum) velNum.textContent = Math.round(msToDisplay(velActual));
    if (velUnit) velUnit.textContent = unidad();
    const [dVal, dUnit] = formatDist(distMetros);
    if (distNum) distNum.textContent = dVal;
    if (distUnit) distUnit.textContent = dUnit;
  }

  window.resetDistancia = function() {
    distMetros = 0; lastLat = null; lastLon = null;
    actualizarPanelBrujula();
  };
  window.actualizarPanelBrujula = actualizarPanelBrujula;

  function msToDisplay(ms) {
    const usaMph = window.usaMph || false;
    return usaMph ? (ms * 2.23694) : (ms * 3.6);
  }

  function unidad() {
    return (window.usaMph || false) ? 'mph' : 'km/h';
  }

  function actualizarFila(ms) {
    const row = document.getElementById('velocidadRow');
    const txt = document.getElementById('velocidadTxt');
    if (!row || !txt) return;
    if (ms < UMBRAL_MS) {
      row.style.display = 'none';
      return;
    }
    const v = Math.round(msToDisplay(ms));
    txt.textContent = v + ' ' + unidad();
    // row.style.display = 'flex'; // velocímetro oculto de pantalla principal
  }

  function actualizarModal() {
    const v = Math.round(msToDisplay(velActual));
    const vMax = velMax > 0 ? Math.round(msToDisplay(velMax)) : null;
    const vMedia = velCount > 0 ? Math.round(msToDisplay(velSuma / velCount)) : null;
    const maxDisplay = (window.usaMph || false) ? 110 : MAX_VEL;

    const numero = document.getElementById('velNumero');
    const arco = document.getElementById('velArco');
    const aguja = document.getElementById('velAguja');
    const maxN = document.getElementById('velMaxNumero');
    const mediaN = document.getElementById('velMediaNumero');
    const unidadEl = document.getElementById('velUnidad');
    const tituloEl = document.getElementById('velTitulo');
    const maxLabel = document.getElementById('velMaxLabel');
    const mediaLabel = document.getElementById('velMediaLabel');
    const T = window.T || {};

    if (tituloEl) tituloEl.textContent = T.tuVelocidad || 'Tu velocidad';
    if (unidadEl) unidadEl.textContent = unidad();
    if (maxLabel) maxLabel.textContent = T.velMax || 'Máx.';
    if (mediaLabel) mediaLabel.textContent = T.velMedia || 'Media';

    if (numero) numero.textContent = v;
    if (maxN) maxN.textContent = vMax !== null ? vMax : '—';
    if (mediaN) mediaN.textContent = vMedia !== null ? vMedia : '—';

    // arco: 220px total, proporcional al % de maxDisplay
    if (arco) {
      const pct = Math.min(v / maxDisplay, 1);
      const offset = 220 - pct * 220;
      arco.style.strokeDashoffset = offset;
    }
    // aguja: de -90° (izq) a +90° (der)
    if (aguja) {
      const pct = Math.min(v / maxDisplay, 1);
      const deg = -90 + pct * 180;
      aguja.style.transform = `rotate(${deg}deg)`;
    }
  }

  function onPos(pos) {
    const ms = pos.coords.speed !== null ? pos.coords.speed : 0;
    velActual = ms;
    if (ms >= UMBRAL_MS) {
      if (ms > velMax) velMax = ms;
      velSuma += ms;
      velCount++;
    }
    // Acumular distancia
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    if (lastLat !== null && ms >= UMBRAL_MS) {
      distMetros += haversineM(lastLat, lastLon, lat, lon);
    }
    lastLat = lat; lastLon = lon;

    actualizarFila(ms);
    const modal = document.getElementById('velModal');
    if (modal && modal.style.display !== 'none') actualizarModal();
    // Actualizar panel en modal brújula siempre
    actualizarPanelBrujula();
  }

  function iniciarWatch() {
    if (_bienvenidaActiva) return;
    if (watchId !== null || !navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(onPos, null, { enableHighAccuracy: true, maximumAge: 1000 });
  }
  // Arrancar el velocímetro cuando el usuario pase la bienvenida
  window._iniciarWatchVelocimetro = iniciarWatch;

  window.abrirVelocimetro = function() {
    const modal = document.getElementById('velModal');
    if (!modal) return;
    actualizarModal();
    modal.style.display = 'flex';
  };

  window.cerrarVelocimetro = function() {
    const modal = document.getElementById('velModal');
    if (modal) modal.style.display = 'none';
  };

  // Arrancar en cuanto el DOM esté listo
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciarWatch);
  } else {
    iniciarWatch();
  }
})();

    const dLat = (lat2-lat1)*r, dLon = (lon2-lon1)*r;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

      if (d < bestDist) { bestDist = d; best = c; }
    }
    // Si está a más de 1500 km de España, el eclipse no es visible
    if (bestDist > 1500) return null;
    const hasTot = best[8] === 1;
    return {
      c1:          best[2],
      c2:          best[3],
      peakUTC:     best[4],
      c3:          best[5],
      c4:          best[6],
      hasTotality: hasTot,
      obscuration: hasTot ? 100 : Math.round(best[7] * 100),
    };
  }

  function fmt(hhmm) {
    return hhmm || '—';
  }

  function usarCoords(lat, lon) {
    const d = eclipseDataForCoords(lat, lon);

    if (!d || d.obscuration < 5) { banner.classList.remove('visible'); return; }

    banner.classList.add('visible');
    const eclInfo = document.getElementById('eclInfo');
    const isTotal = d.hasTotality;

    eclInfo.innerHTML = isTotal
      ? `<strong>${T.total}</strong> ${T.peak}: <strong>${fmt(d.peakUTC)}</strong>`
      : `${T.coverage}: <strong>${d.obscuration}%</strong> · ${T.peak}: <strong>${fmt(d.peakUTC)}</strong>`;

    let rows = `<div class="ecl-row"><span>${T.c1}</span><span>${fmt(d.c1)}</span></div>`;
    if (isTotal && d.c2) rows += `<div class="ecl-row"><span>${T.c2}</span><span>${fmt(d.c2)}</span></div>`;
    rows += `<div class="ecl-row"><span>${T.max}</span><span>${fmt(d.peakUTC)}</span></div>`;
    if (isTotal && d.c3) rows += `<div class="ecl-row"><span>${T.c3}</span><span>${fmt(d.c3)}</span></div>`;
    if (d.c4) rows += `<div class="ecl-row"><span>${T.c4}</span><span>${fmt(d.c4)}</span></div>`;
    rows += `<div class="ecl-row"><span>${T.coverage}</span><span>${d.obscuration}%</span></div>`;

    document.getElementById('eclModalContent').innerHTML = rows;
    document.getElementById('eclTip').textContent = isTotal ? T.tipTotal : T.tipPartial;
    document.getElementById('eclExtLink').href =
      `https://www.timeanddate.com/eclipse/map/2026-august-12?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`;
  }

  // Esperar coords de la app (con reintentos) o pedir GPS directamente
  function tryCoords(attempts) {
    if (ubicacionManual && ubicacionManual.lat) {
      usarCoords(ubicacionManual.lat, ubicacionManual.lon);
    } else if (currentCoords && currentCoords.lat) {
      usarCoords(currentCoords.lat, currentCoords.lon);
    } else if (attempts > 0) {
      setTimeout(() => tryCoords(attempts - 1), 1500);
    } else if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => usarCoords(p.coords.latitude, p.coords.longitude),
        () => { document.getElementById('eclInfo').textContent = T.noLocation; banner.classList.add('visible'); },
        { timeout: 8000, maximumAge: 60000 }
      );
    }
  }
  // Exponer función para que cargarDatos la llame cuando cambie la ciudad
  window.eclipseActualizar = usarCoords;

  tryCoords(5);

  // Banner entero abre el modal
  banner.addEventListener('click', e => {
    if (e.target.id === 'eclipseClose') return;
    modal.classList.add('open');
  });
  document.getElementById('eclipseClose').addEventListener('click', e => {
    e.stopPropagation();
    banner.classList.remove('visible');
    localStorage.setItem('eclipse2026closed', '1');
  });
  document.getElementById('eclModalClose').addEventListener('click', () => {
    modal.classList.remove('open');
  });
  modal.addEventListener('click', e => {
    if (e.target === modal) modal.classList.remove('open');
  });
})();

  <button id="btnDenegadoBuscar" style="width:100%;max-width:300px;padding:16px;border:none;border-radius:16px;background:#fff;color:#1e3a5f;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:16px"></button>
  <button id="btnDenegadoAjustes" style="width:100%;max-width:300px;padding:14px;border:2px solid rgba(255,255,255,0.3);border-radius:16px;background:transparent;color:#fff;font-size:0.9rem;cursor:pointer;margin-bottom:12px"></button>
  <div id="instruccionesAjustes" style="display:none;background:rgba(0,0,0,0.25);border-radius:14px;padding:14px 18px;max-width:300px;font-size:0.82rem;line-height:1.7;opacity:0.9;text-align:left"></div>
</div>

<script>
(function() {
  const KEY = 'ql_bienvenida_vista';
  const elBienvenida = document.getElementById('modalBienvenida');
  const elDenegado = document.getElementById('modalPermisoDenegado');

  // Aplicar traducciones (T está definido antes de este script)
  function aplicarTraducciones() {
    const t = (typeof T !== 'undefined') ? T : {};
    document.getElementById('bienvenidaSubEl').textContent  = t.bienvenidaSub  || 'El tiempo real donde estás';
    document.getElementById('bienvenidaBodyEl').textContent = t.bienvenidaBody || 'Para mostrarte la temperatura necesitamos saber dónde estás. Tu ubicación nunca sale de tu dispositivo.';
    document.getElementById('btnBienvenidaPermitir').textContent = t.bienvenidaBtn  || 'Permitir ubicación';
    document.getElementById('btnBienvenidaCiudad').textContent  = t.bienvenidaLink || 'Prefiero buscar mi ciudad →';
    document.getElementById('denegadoTitEl').textContent   = t.denegadoTit       || 'Sin ubicación';
    document.getElementById('denegadoBodyEl').textContent  = t.denegadoBody      || 'No podemos detectar tu posición automáticamente, pero puedes usar la app igualmente buscando tu ciudad.';
    document.getElementById('btnDenegadoBuscar').textContent   = t.denegadoBtn        || '🔍 Buscar mi ciudad';
    document.getElementById('btnDenegadoAjustes').textContent  = t.denegadoAjustesBtn || 'Ir a Ajustes del sistema';
    document.getElementById('instruccionesAjustes').textContent = t.denegadoInstr || 'Ajustes → Aplicaciones → QuickTemp → Permisos → Ubicación → Activar';
  }
  aplicarTraducciones();

  if (!localStorage.getItem(KEY)) {
    // Primera vez: mostrar bienvenida, NO llamar actualizar()
    elBienvenida.style.display = 'flex';
    localStorage.setItem('ql_ayuda_vista', '1');
  } else {
    // Ya vio la bienvenida: arrancar directamente
    actualizar();
  }

  document.getElementById('btnBienvenidaPermitir').addEventListener('click', () => {
    localStorage.setItem(KEY, '1');
    _bienvenidaActiva = false;
    elBienvenida.style.display = 'none';
    if (window._iniciarWatchVelocimetro) window._iniciarWatchVelocimetro();
    actualizar();
  });

  document.getElementById('btnBienvenidaCiudad').addEventListener('click', () => {
    localStorage.setItem(KEY, '1');
    _bienvenidaActiva = false;
    elBienvenida.style.display = 'none';
    document.getElementById('buscador').classList.add('abierto');
  });

  window.mostrarPermisoDenegado = function() {
    elDenegado.style.display = 'flex';
  };
  window.ocultarPermisoDenegado = function() {
    elDenegado.style.display = 'none';
  };

  document.getElementById('btnDenegadoBuscar').addEventListener('click', () => {
    elDenegado.style.display = 'none';
    document.getElementById('buscador').classList.add('abierto');
  });

  document.getElementById('btnDenegadoAjustes').addEventListener('click', () => {
    const instr = document.getElementById('instruccionesAjustes');
    instr.style.display = instr.style.display === 'none' ? 'block' : 'none';
  });
})();
</script>

</body>
</html>
