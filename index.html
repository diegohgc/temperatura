<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>Temperatura</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  #bg {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(160deg, #1e3a5f, #3a6ea5);
    transition: background 1.5s ease;
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    color: #fff;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 16px) + 60px);
    transition: color 1.5s ease;
  }
  .card {
    text-align: center;
    width: 100%;
    max-width: 420px;
    padding-top: 8px;
    position: relative;
  }
  .btn-buscar {
    background: none;
    border: none;
    padding: 4px;
    opacity: 0.55;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 0 auto 6px;
  }
  .btn-buscar-texto { font-size: 0.72rem; color: #fff; line-height: 1; }
  .btn-buscar svg {
    width: 16px; height: 16px;
    stroke: #fff; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .buscador { max-width: 260px; margin: 0 auto 10px; }
  .buscar-fila { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 4px; }
  .btn-fav { background: none; border: none; cursor: pointer; font-size: 1rem; color: inherit; opacity: 0.75; padding: 0; line-height: 1; transition: opacity 0.2s; display: flex; align-items: center; gap: 4px; }
  .btn-fav:hover { opacity: 1; }
  .btn-ajustes { position: absolute; top: 10px; left: 1px; background: rgba(255,255,255,0.15); border: none; border-radius: 6px; color: inherit; font-size: 0.8rem; padding: 2px 6px; cursor: pointer; opacity: 0.8; transition: opacity 0.2s; line-height: 1; }
  .btn-ajustes:hover { opacity: 1; }
  .ajustes-panel { position: absolute; top: 38px; left: 12px; background: rgba(30,30,40,0.92); backdrop-filter: blur(8px); border-radius: 10px; padding: 10px 14px; z-index: 100; min-width: 180px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  .ajustes-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 0.82rem; opacity: 0.9; }
  .ajustes-fila:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.1); }
  .ajustes-label { color: #fff; }
  .ajustes-toggle { display: flex; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; }
  .ajustes-toggle button { background: none; border: none; color: #fff; font-size: 0.78rem; font-weight: 600; padding: 4px 9px; cursor: pointer; opacity: 0.55; transition: opacity 0.15s, background 0.15s; }
  .ajustes-toggle button.activo { background: rgba(255,255,255,0.25); opacity: 1; }
  .ajustes-favs-titulo { font-size: 0.7rem; opacity: 0.55; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; margin: 8px 0 4px; }
  .ajustes-fav-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; border-radius: 7px; background: rgba(255,255,255,0.08); margin-bottom: 4px; cursor: pointer; transition: background 0.15s; }
  .ajustes-fav-item:hover { background: rgba(255,255,255,0.18); }
  .ajustes-fav-nombre { font-size: 0.82rem; color: #fff; }
  .ajustes-fav-remove { background: none; border: none; color: #fff; opacity: 0.4; cursor: pointer; font-size: 0.85rem; padding: 0 0 0 8px; line-height: 1; }
  .ajustes-fav-remove:hover { opacity: 0.9; }
  .btn-fav-texto { font-size: 0.82rem; }
  .fav-titulo { font-size: 0.7rem; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.06em; margin: 10px 0 5px; }
  .fav-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.1); margin-bottom: 5px; cursor: pointer; }
  .fav-item:hover { background: rgba(255,255,255,0.18); }
  .fav-nombre { font-size: 0.88rem; }
  .fav-remove { background: none; border: none; color: inherit; opacity: 0.45; cursor: pointer; font-size: 1rem; padding: 2px 0 2px 8px; }
  .fav-remove:hover { opacity: 1; }
  .buscador input {
    width: 100%; padding: 8px 12px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.1); color: #fff; font-size: 0.85rem;
  }
  .buscador input::placeholder { color: rgba(255,255,255,0.6); }
  .resultados { text-align: left; margin-top: 4px; }
  .resultado-item { padding: 6px 10px; font-size: 0.85rem; opacity: 0.9; cursor: pointer; border-radius: 8px; }
  .resultado-item:active { background: rgba(255,255,255,0.15); }
  .link-ubicacion {
    background: none; border: none; color: #bfe0ff;
    font-size: 0.8rem; padding: 6px 0 0; text-decoration: underline; cursor: pointer;
  }
  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
    text-align: left;
  }
  .ciudad { font-size: 1.8rem; font-weight: 700; line-height: 1.1; }
  .top-info {
    text-align: right; font-size: 0.8rem; opacity: 0.85;
    line-height: 1.8; white-space: nowrap; padding-top: 4px;
  }
  .principal {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 4px 0 8px;
  }
  .icono { width: 64px; height: 64px; }
  .icono svg {
    width: 100%; height: 100%; stroke: #fff; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .temp-wrap { position: relative; display: flex; align-items: center; }
  .temp { font-size: 4rem; font-weight: 700; line-height: 1; }
  .temp-minmax {
    position: absolute;
    left: 100%;
    padding-left: 8px;
    font-size: 0.78rem;
    opacity: 0.8;
    display: flex;
    flex-direction: column;
    line-height: 1.5;
    white-space: nowrap;
  }
  .temp-minmax .tmx { font-weight: 600; }
  .temp-minmax .tmn { opacity: 0.75; }
  .desc { font-size: 1rem; opacity: 0.9; margin-bottom: 2px; }
  .lluvia { font-size: 0.78rem; opacity: 0.8; margin-bottom: 4px; min-height: 1em; }
  .aire { font-size: 0.82rem; opacity: 0.85; margin-bottom: 2px; min-height: 1em; }
  .detalles {
    display: flex; justify-content: center; gap: 20px;
    font-size: 0.9rem; opacity: 0.85; margin-bottom: 14px;
  }
  .panel {
    background: rgba(255,255,255,0.12);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
  }
  .panel-interior { display: flex; justify-content: space-around; align-items: center; }
  .panel-interior[hidden] { display: none; }
  .interior-item { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
  .interior-valor { font-size: 1.5rem; font-weight: 600; }
  .interior-label { font-size: 0.65rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; text-align: center; }
  .panel-titulo {
    font-size: 0.72rem; opacity: 0.65;
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
  }
  .marea-extremos { display: flex; justify-content: space-around; margin-bottom: 8px; }
  .marea-extremo { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .marea-extremo .me-icono svg {
    width: 26px; height: 26px; stroke: #fff; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .marea-extremo .me-label { font-size: 0.68rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.04em; }
  .marea-agua { font-size: 0.85rem; opacity: 0.8; text-align: center; margin-top: 6px; }
  .marea-extremo .me-hora { font-size: 0.95rem; font-weight: 600; }
  .marea-extremo .me-altura { font-size: 0.78rem; opacity: 0.8; }
  .marea-estado { font-size: 0.85rem; opacity: 0.9; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 6px; }
  #panelMarea { cursor: pointer; }
  #panelMarea:hover { opacity: 0.85; }
  /* Modal mareas */
  #modalMarea {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
  }
  #modalMarea.abierto { display: flex; }
  .modal-sheet {
    background: rgba(20,30,50,0.97); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px; padding: 20px 18px 32px;
    color: #fff; max-height: 90vh; overflow-y: auto;
  }
  .modal-handle-row {
    display: flex; align-items: center; justify-content: center;
    position: relative; margin-bottom: 16px;
  }
  .modal-handle {
    width: 40px; height: 4px; background: rgba(255,255,255,0.3);
    border-radius: 2px;
  }
  .modal-close {
    position: absolute; right: 0; top: -4px;
    background: rgba(255,255,255,0.12); border: none; color: #fff;
    border-radius: 50%; width: 28px; height: 28px; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .modal-titulo {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
    opacity: 0.6; margin-bottom: 14px; text-align: center;
  }
  #mareaChart { width: 100%; height: 130px; display: block; margin-bottom: 16px; }
  .modal-extremos {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr));
    gap: 10px; margin-top: 4px;
  }
  .modal-extremo {
    background: rgba(255,255,255,0.08); border-radius: 10px;
    padding: 10px 6px; text-align: center;
  }
  .modal-extremo .mex-tipo { font-size: 0.65rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
  .modal-extremo .mex-hora { font-size: 1rem; font-weight: 600; margin: 3px 0; }
  .modal-extremo .mex-alt { font-size: 0.8rem; opacity: 0.8; }
  .horas { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 2px; }
  .horas::-webkit-scrollbar { height: 0; }
  .hora { flex: 0 0 auto; text-align: center; min-width: 46px; }
  .hora .h { font-size: 0.8rem; opacity: 0.75; margin-bottom: 4px; }
  .hora .icono-hora { width: 28px; height: 28px; margin: 0 auto 4px; }
  .hora .icono-hora svg {
    width: 100%; height: 100%; stroke: #fff; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .hora .t { font-size: 0.9rem; font-weight: 600; }
  .hora .p { font-size: 0.75rem; opacity: 0.8; color: #bfe0ff; margin-top: 2px; }
  .dia { flex: 0 0 auto; text-align: center; min-width: 52px; }
  .dia .d { font-size: 0.8rem; opacity: 0.75; margin-bottom: 4px; text-transform: capitalize; }
  .dia .icono-dia { width: 28px; height: 28px; margin: 0 auto 4px; }
  .dia .icono-dia svg {
    width: 100%; height: 100%; stroke: #fff; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .dia .max { font-size: 0.9rem; font-weight: 600; }
  .dia .min { font-size: 0.8rem; opacity: 0.7; }
  .dia-lluvia { font-size: 0.72rem; color: #7dd3fc; opacity: 0.9; margin-top: 2px; }
  .bottom-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 4px; gap: 12px;
  }
  button {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4);
    color: #fff; padding: 10px 22px; border-radius: 24px; font-size: 0.95rem; cursor: pointer;
  }
  button:active { background: rgba(255,255,255,0.3); }
  .estado { font-size: 0.8rem; opacity: 0.7; text-align: right; flex: 1; }
  .ad-bottom {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 100; height: 50px;
  }
  .ad-bottom iframe {
    width: 100%; height: 50px; border: none; display: block;
  }

  @media (orientation: landscape) and (max-height: 500px) {
    body { align-items: flex-start; padding: 4px 16px; }
    .card {
      max-width: 100%; padding-top: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto;
      column-gap: 14px;
      align-items: start;
      text-align: center;
    }
    #btnBuscarCiudad { grid-column: 1; grid-row: 1; margin-bottom: 0; }
    .top-row         { grid-column: 1; grid-row: 2; margin-bottom: 4px; }
    .buscador        { grid-column: 1 / 3; grid-row: 3; }
    #principal       { grid-column: 1; grid-row: 4; margin: 0; }
    .desc            { grid-column: 1; grid-row: 5; font-size: 0.78rem; margin-bottom: 2px; }
    .aire            { grid-column: 1; grid-row: 6; font-size: 0.7rem; margin-bottom: 4px; }
    .detalles        { grid-column: 1; grid-row: 7; font-size: 0.78rem; margin-bottom: 4px; gap: 10px; }
    .bottom-row      { grid-column: 1; grid-row: 8; }
    #panelHoras      { grid-column: 2; grid-row: 1 / 5; padding: 8px; margin-bottom: 6px; }
    #panelDias       { grid-column: 2; grid-row: 5 / 9; padding: 8px; }
    #panelMarea      { grid-column: 1 / 3; grid-row: 9; padding: 6px 14px; margin-bottom: 4px; }
    .ciudad { font-size: 1.1rem; }
    .top-info { font-size: 0.68rem; line-height: 1.5; }
    .icono { width: 38px; height: 38px; }
    .temp { font-size: 2.2rem; }
    .panel-titulo { margin-bottom: 4px; }
    .marea-extremos { margin-bottom: 4px; }
    .bottom-row button { padding: 6px 14px; font-size: 0.8rem; }
    .marea-extremo .me-label { font-size: 0.6rem; }
    .marea-extremo .me-icono svg { width: 20px; height: 20px; }
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <div class="card">
    <button class="btn-ajustes" id="btnAjustes"></button>
    <div id="ajustesPanel" hidden>
      <div class="ajustes-panel">
        <div class="ajustes-fila">
          <span class="ajustes-label" id="ajustesTempLabel"></span>
          <div class="ajustes-toggle">
            <button id="btnC">°C</button>
            <button id="btnF">°F</button>
          </div>

          <span class="ajustes-label" id="ajustesVelLabel"></span>

            <button id="btnKmh">km/h</button>
            <button id="btnMph">mph</button>
          </div>
        </div>
        <div id="ajustesFavsSeccion" hidden>
          <div class="ajustes-favs-titulo" id="ajustesFavsTitulo"></div>
          <div id="ajustesFavsLista"></div>
        </div>
      </div>
    </div>
    <div class="buscar-fila">
      <button class="btn-buscar" id="btnBuscarCiudad" aria-label="Buscar otra ciudad">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M19.5 19.5l-4.3-4.3"/></svg>
        <span class="btn-buscar-texto" id="textoCambiarCiudad"></span>
      </button>
      <button class="btn-fav" id="btnFavorito" aria-label="Guardar favorito" hidden>☆</button>
    </div>
    <div class="top-row">
      <div class="ciudad" id="ciudad">—</div>
      <div class="top-info">
        <div id="altitud"></div>
        <div id="solInfo"></div>
      </div>
    </div>
    <div class="buscador" id="buscador" hidden>
      <input type="text" id="inputCiudad" placeholder="Buscar ciudad..." autocomplete="off" />
      <div id="favoritosSeccion" hidden>
        <div class="fav-titulo" id="favTitulo"></div>
        <div id="favoritosLista"></div>
      </div>
      <div class="resultados" id="resultadosCiudad"></div>
      <button class="link-ubicacion" id="btnUsarGps">Usar mi ubicación</button>
    </div>
    <div class="principal" id="principal">
      <div class="icono" id="icono"></div>
      <div class="temp-wrap">
        <div class="temp" id="temp">--°</div>
        <div class="temp-minmax" id="tempMinMax"></div>
      </div>
    </div>
    <div class="desc" id="desc"></div>
    <div class="lluvia" id="lluvia"></div>
    <div class="detalles">
      <span id="sensacion"></span>
      <span id="viento"></span>
      <span id="humedad"></span>
    </div>
    <div class="aire" id="aire"></div>
    <div class="aire" id="aireExtra" hidden></div>
    <div class="panel" id="panelMarea" hidden>
      <div class="panel-titulo" id="titMarea"></div>
      <div class="marea-extremos" id="mareaExtremos"></div>
      <div class="marea-estado" id="marea"></div>
      <div class="marea-agua" id="mareaAgua"></div>
    </div>
    <div class="panel panel-interior" id="panelInterior" hidden>
      <div class="interior-item">
        <div class="interior-valor" id="intUV">--</div>
        <div class="interior-label" id="intUVLabel">UV</div>
      </div>
      <div class="interior-item">
        <div class="interior-valor" id="intSol">--</div>
        <div class="interior-label" id="intSolLabel">Sol</div>
      </div>
      <div class="interior-item">
        <div class="interior-valor" id="intAire">--</div>
        <div class="interior-label" id="intAireLabel">Aire</div>
      </div>
    </div>
    <div class="panel" id="panelHoras">
      <div class="horas" id="horas"></div>
    </div>
    <div class="panel" id="panelDias">
      <div class="horas" id="dias"></div>
    </div>
    <div class="bottom-row">
      <button id="btnActualizar">Actualizar</button>
      <div class="estado" id="estado"></div>
    </div>
  </div>
  <div class="ad-bottom">
    <iframe srcdoc="<!DOCTYPE html><html><head><script async src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-5015878857432448' crossorigin='anonymous'><\/script></head><body style='margin:0;padding:0;overflow:hidden'><ins class='adsbygoogle' style='display:block;width:100%;height:50px' data-ad-client='ca-app-pub-5015878857432448' data-ad-slot='6686595753'></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({})<\/script></body></html>"></iframe>
  </div>

function detectarIdioma() {
  const full = (navigator.language || navigator.userLanguage || 'es').toLowerCase();
  if (full.startsWith('ca')) return 'ca';
  if (full.startsWith('eu')) return 'eu';
  if (full.startsWith('gl')) return 'gl';
  const lang = full.substring(0, 2);
  return TRADUCCIONES[lang] ? lang : 'en';
}

const idioma = detectarIdioma();
const T = TRADUCCIONES[idioma];
const defaultF = (navigator.language || '').toLowerCase() === 'en-us';
let usaFahrenheit = localStorage.getItem('ql_unidad') ? localStorage.getItem('ql_unidad') === 'F' : defaultF;
let usaMph = localStorage.getItem('ql_velocidad') === 'mph';
function toTemp(c) {
  return usaFahrenheit ? Math.round(c * 9 / 5 + 32) + '°F' : Math.round(c) + '°';
}
function toViento(kmh) {
  return usaMph ? Math.round(kmh * 0.621371) + ' mph' : Math.round(kmh) + ' km/h';
}
function actualizarAjustes() {
  document.getElementById('btnC').classList.toggle('activo', !usaFahrenheit);
  document.getElementById('btnF').classList.toggle('activo', usaFahrenheit);
  document.getElementById('btnKmh').classList.toggle('activo', !usaMph);
  document.getElementById('btnMph').classList.toggle('activo', usaMph);
}
function renderFavsEnAjustes() {
  const seccion = document.getElementById('ajustesFavsSeccion');
  const lista = document.getElementById('ajustesFavsLista');
  const favs = loadFavoritos();
  if (!favs.length) { seccion.hidden = true; return; }
  seccion.hidden = false;
  lista.innerHTML = favs.map((f, i) => `
    <div class="ajustes-fav-item" data-i="${i}">
      <span class="ajustes-fav-nombre">${f.nombre}</span>
      <button class="ajustes-fav-remove" data-i="${i}" aria-label="Eliminar">✕</button>
    </div>`).join('');
  lista.querySelectorAll('.ajustes-fav-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('ajustes-fav-remove')) return;
      const f = loadFavoritos()[+el.dataset.i];
      if (!f) return;
      ubicacionManual = { lat: f.lat, lon: f.lon, nombre: f.nombre };
      document.getElementById('ajustesPanel').hidden = true;
      cargarDatos(f.lat, f.lon, f.nombre);
    });
  });
  lista.querySelectorAll('.ajustes-fav-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const favs = loadFavoritos();
      favs.splice(+btn.dataset.i, 1);
      saveFavoritos(favs);
      renderFavsEnAjustes();
      renderFavoritosLista();
      actualizarBtnFav();
    });
  });
}

document.getElementById('btnAjustes').addEventListener('click', (e) => {
  e.stopPropagation();
  const panel = document.getElementById('ajustesPanel');
  panel.hidden = !panel.hidden;
  if (!panel.hidden) renderFavsEnAjustes();
});
document.addEventListener('click', () => { document.getElementById('ajustesPanel').hidden = true; });
document.getElementById('ajustesPanel').addEventListener('click', (e) => e.stopPropagation());

function iconoParaCodigo(codigo, esDia = true) {
  if (codigo === 0) return esDia ? ICONOS.sol : ICONOS.luna;
  if (codigo === 1 || codigo === 2) return esDia ? ICONOS.solNube : ICONOS.lunaNube;
  if (codigo === 3) return ICONOS.nube;
  if (codigo === 45 || codigo === 48) return ICONOS.niebla;
  if (codigo >= 51 && codigo <= 55) return ICONOS.llovizna;
  if ((codigo >= 61 && codigo <= 65) || (codigo >= 80 && codigo <= 82)) return ICONOS.lluvia;
  if (codigo >= 71 && codigo <= 75) return ICONOS.nieve;
  if (codigo >= 95) return ICONOS.tormenta;
  return ICONOS.solNube;
}

function colorParaTemp(temp) {
  const rangos = [
    { t: 0,   c1: '#b8d8f0', c2: '#8ab8d8', texto: '#1a3a5c' },
    { t: 10,  c1: '#1e3a5f', c2: '#3a6ea5', texto: '#ffffff' },
    { t: 18,  c1: '#1a4a6e', c2: '#2a7a8a', texto: '#ffffff' },
    { t: 24,  c1: '#1e5c3a', c2: '#2e8a5a', texto: '#ffffff' },
    { t: 30,  c1: '#7a4a10', c2: '#c07020', texto: '#ffffff' },
    { t: 35,  c1: '#8a2a10', c2: '#c04020', texto: '#ffffff' },
    { t: 999, c1: '#6a1010', c2: '#a02020', texto: '#ffffff' },
  ];
  for (let i = 0; i < rangos.length - 1; i++) {
    const a = rangos[i], b = rangos[i + 1];
    if (temp <= a.t || (temp >= a.t && temp < b.t)) {
      if (temp <= a.t) return a;
      const ratio = (temp - a.t) / (b.t - a.t);
      return {
        c1: interpolarColor(a.c1, b.c1, ratio),
        c2: interpolarColor(a.c2, b.c2, ratio),
        texto: ratio < 0.5 ? a.texto : b.texto
      };
    }
  }
  return rangos[rangos.length - 1];
}

function interpolarColor(hex1, hex2, t) {
  const r1 = parseInt(hex1.slice(1,3),16), g1 = parseInt(hex1.slice(3,5),16), b1 = parseInt(hex1.slice(5,7),16);
  const r2 = parseInt(hex2.slice(1,3),16), g2 = parseInt(hex2.slice(3,5),16), b2 = parseInt(hex2.slice(5,7),16);
  const r = Math.round(r1+(r2-r1)*t), g = Math.round(g1+(g2-g1)*t), b = Math.round(b1+(b2-b1)*t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function aplicarColorTemp(temp) {
  const col = colorParaTemp(temp);
  document.getElementById('bg').style.background = `linear-gradient(160deg, ${col.c1}, ${col.c2})`;
  document.body.style.color = col.texto;

async function obtenerMarea(lat, lon) {
  const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=sea_level_height_msl,sea_surface_temperature,wave_height&forecast_days=2&timezone=auto`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('No es costero');
  const data = await r.json();
  const tiempos = data.hourly && data.hourly.time;
  const alturas = data.hourly && data.hourly.sea_level_height_msl;
  const tempAguas = data.hourly && data.hourly.sea_surface_temperature;
  const waveHeights = data.hourly && data.hourly.wave_height;
  if (!tiempos || !alturas || !alturas.some(h => h !== null)) return null;

  const ahora = Date.now();
  const hoy = new Date().toDateString();

  // Find today's extremes
  const extremos = [];
  for (let i = 1; i < alturas.length - 1; i++) {
    if (alturas[i] === null || alturas[i-1] === null || alturas[i+1] === null) continue;
    const subeBefore = alturas[i] > alturas[i-1];
    const subeAfter = alturas[i+1] > alturas[i];
    if (subeBefore === subeAfter) continue;

    let horaMs = new Date(tiempos[i]).getTime();
    let altura = alturas[i];
    const h0 = alturas[i-1], h1 = alturas[i], h2 = alturas[i+1];
    const den = h0 - 2*h1 + h2;
    if (den !== 0) {
      const offset = 0.5*(h0-h2)/den;
      if (offset > -1 && offset < 1) {
        horaMs += offset * 3600000;
        altura = h1 - (h0-h2)*(h0-h2)/(8*den);
      }
    }
    if (new Date(horaMs).toDateString() !== hoy) continue;
    extremos.push({ hora: horaMs, altura: Math.max(0, altura), tipo: subeBefore ? 'pleamar' : 'bajamar' });
  }

  // Current state
  let idx = tiempos.findIndex(t => new Date(t).getTime() >= ahora);
  if (idx < 0) idx = tiempos.length - 2;
  if (idx >= alturas.length - 1) idx = alturas.length - 2;
  const subiendo = alturas[idx+1] > alturas[idx];

  // Next extreme
  let k = idx + 1;
  while (k < alturas.length - 1) {
    if ((alturas[k+1] > alturas[k]) !== (alturas[k] > alturas[k-1])) break;
    k++;
  }
  let horaNext = new Date(tiempos[Math.min(k, tiempos.length-1)]).getTime();
  if (k > 0 && k < alturas.length - 1) {
    const h0 = alturas[k-1], h1 = alturas[k], h2 = alturas[k+1];
    const den = h0 - 2*h1 + h2;
    if (den !== 0) {
      const offset = 0.5*(h0-h2)/den;
      if (offset > -1 && offset < 1) horaNext += offset*3600000;
    }
  }
  const horaTexto = new Date(horaNext).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
  const estadoTexto = subiendo ? `${T.mareaSubiendo} ${horaTexto}` : `${T.mareaBajando} ${horaTexto}`;

  // Current sea surface temperature (closest non-null value to now)
  let tempAgua = null;
  if (tempAguas) {
    let bestIdx = idx;
    for (let d = 0; d < tempAguas.length; d++) {
      const i1 = Math.max(0, idx - d), i2 = Math.min(tempAguas.length - 1, idx + d);
      if (tempAguas[i1] !== null) { bestIdx = i1; break; }
      if (tempAguas[i2] !== null) { bestIdx = i2; break; }
    }
    if (tempAguas[bestIdx] !== null) tempAgua = Math.round(tempAguas[bestIdx]);
  }

  let waveHeight = null;
  if (waveHeights) {
    for (let d = 0; d < waveHeights.length; d++) {
      const i1 = Math.max(0, idx - d), i2 = Math.min(waveHeights.length - 1, idx + d);
      if (waveHeights[i1] !== null) { waveHeight = waveHeights[i1]; break; }
      if (waveHeights[i2] !== null) { waveHeight = waveHeights[i2]; break; }
    }
  }

  return { extremos, estadoTexto, tempAgua, waveHeight, tiempos, alturas };
}

  const m15 = tiempo.minutely_15;
  let weatherCode = c.weather_code;
  let isDay = c.is_day === 1;
  if (m15 && m15.time && m15.weather_code) {
    const now = new Date();
    const idx = m15.time.reduce((best, t, i) => new Date(t) <= now ? i : best, 0);
    if (idx >= 0) { weatherCode = m15.weather_code[idx]; isDay = m15.is_day ? m15.is_day[idx] === 1 : isDay; }
  }
  // Corregir icono si la nubosidad real contradice el código del modelo
  const owmClouds = owmData?.clouds?.all ?? null;
  const cloudCover = owmClouds !== null ? owmClouds : Math.max(c.cloud_cover ?? 0, c.cloud_cover_low ?? 0, c.cloud_cover_mid ?? 0, c.cloud_cover_high ?? 0);
  if (weatherCode <= 1 && cloudCover >= 75) weatherCode = 3;
  else if (weatherCode <= 1 && cloudCover >= 50) weatherCode = 2;
  elTemp.textContent = toTemp(c.temperature_2m);
  elDesc.textContent = CODIGOS[weatherCode] || '';
  elIcono.innerHTML = iconoParaCodigo(weatherCode, isDay);
  const elLluvia = document.getElementById('lluvia');
  const hourly = tiempo.hourly;
  if (hourly && hourly.time && hourly.precipitation_probability) {
    const now = new Date();
    const idx = hourly.time.findIndex(t => new Date(t) >= now);
    const prob = idx >= 0 ? hourly.precipitation_probability[idx] : null;
    elLluvia.textContent = prob !== null && prob > 0 ? `🌧 ${T.probLluvia || 'Rain probability next hour'}: ${prob}%` : '';
  } else {
    elLluvia.textContent = '';
  }
  renderHoras(tiempo.hourly);
  renderSol(tiempo.daily);
  renderDias(tiempo.daily);
  const tieneMarea = renderMarea(mdata);
  renderPanelInterior(c.uv_index, aireData, tiempo.daily && tiempo.daily.sunset ? tiempo.daily.sunset[0] : null, tieneMarea);
  aplicarColorTemp(Math.round(c.temperature_2m));
  const max0 = tiempo.daily && tiempo.daily.temperature_2m_max ? tiempo.daily.temperature_2m_max[0] : null;
  const min0 = tiempo.daily && tiempo.daily.temperature_2m_min ? tiempo.daily.temperature_2m_min[0] : null;
  const elMinMax = document.getElementById('tempMinMax');
  if (max0 !== null && min0 !== null) {
    elMinMax.innerHTML = `<span class="tmx">${toTemp(max0)}</span><span class="tmn">${toTemp(min0)}</span>`;
  }
  elSensacion.textContent = T.sensacion + ' ' + toTemp(c.apparent_temperature);
  elViento.textContent = toViento(c.wind_speed_10m);
  elHumedad.textContent = c.relative_humidity_2m + T.humedad;
  const alt = elevacion && elevacion.elevation && elevacion.elevation[0];
  elAltitud.textContent = alt !== null && alt !== undefined ? (usaMph ? `${T.altitud} ${Math.round(alt * 3.28084)} ft` : `${T.altitud} ${Math.round(alt)} m`) : '';
  document.getElementById('aire').textContent = (aireData && aireData.texto) || '';
}

async function cargarDatos(latitude, longitude, nombreFijo) {
  setEstado(T.consultando);
  try {
    const [tiempo, ciudad, mdata, elevacion, aireData, owmData] = await Promise.all([
      obtenerTiempo(latitude, longitude),
      nombreFijo ? Promise.resolve(nombreFijo) : obtenerCiudad(latitude, longitude),
      obtenerMarea(latitude, longitude).catch(() => null),
      fetch(`https://api.open-meteo.com/v1/elevation?latitude=${latitude}&longitude=${longitude}`).then(r => r.json()).catch(() => null),
      obtenerCalidadAire(latitude, longitude).catch(() => null),
      fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=ee01a14dca6430b5ddb8b0fed708d4ba`).then(r => r.json()).catch(() => null)
    ]);
    elCiudad.textContent = ciudad;
    currentCoords = { lat: latitude, lon: longitude, nombre: ciudad };
    actualizarBtnFav();
    ultimosDatos = { tiempo, ciudad, mdata, elevacion, aireData, owmData };
    renderDatos(ultimosDatos);
    setEstado(T.actualizado + ' ' + new Date().toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' }));
    localStorage.setItem('ql_ultima_act', Date.now().toString());
  } catch (e) {
    setEstado(T.errorTemperatura);
  }
}

async function actualizar() {
  setEstado(T.localizando);
  elTemp.textContent = '--°';
  elDesc.textContent = '';
  if (ubicacionManual) {
    cargarDatos(ubicacionManual.lat, ubicacionManual.lon, ubicacionManual.nombre);
    return;
  }
  if (!navigator.geolocation) {
    setEstado(T.geoNoDisponible);
    return;
  }
  navigator.geolocation.getCurrentPosition((pos) => {
    cargarDatos(pos.coords.latitude, pos.coords.longitude);
  }, (err) => {
    if (err.code === err.PERMISSION_DENIED) {
      setEstado(T.permisoDenegado);
    } else {
      setEstado(T.errorUbicacion);
    }
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

let timeoutBusqueda = null;

function cerrarBuscador() {
  elBuscador.hidden = true;
  inputCiudad.value = '';
  elResultadosCiudad.innerHTML = '';
}

btnBuscarCiudad.addEventListener('click', () => {
  elBuscador.hidden = !elBuscador.hidden;
  if (!elBuscador.hidden) { renderFavoritosLista(); inputCiudad.focus(); }
});

inputCiudad.addEventListener('input', () => {
  clearTimeout(timeoutBusqueda);
  const texto = inputCiudad.value.trim();
  if (texto.length < 2) { elResultadosCiudad.innerHTML = ''; return; }
  timeoutBusqueda = setTimeout(async () => {
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(texto)}&count=5&language=${T.locale.split('-')[0]}`);
      const data = await r.json();
      elResultadosCiudad.innerHTML = '';
      (data.results || []).forEach((res) => {
        const nombre = res.name + (res.admin1 ? `, ${res.admin1}` : '') + (res.country ? `, ${res.country}` : '');
        const item = document.createElement('div');
        item.className = 'resultado-item';
        item.textContent = nombre;
        item.addEventListener('click', () => {
          ubicacionManual = { lat: res.latitude, lon: res.longitude, nombre: res.name + (res.admin1 ? `, ${res.admin1}` : '') };
          cerrarBuscador();
          cargarDatos(ubicacionManual.lat, ubicacionManual.lon, ubicacionManual.nombre);
        });
        elResultadosCiudad.appendChild(item);
      });
    } catch (e) {}
  }, 350);
});

btnUsarGps.addEventListener('click', () => {
  ubicacionManual = null;
  cerrarBuscador();
  actualizar();
});

btn.addEventListener('click', actualizar);
window.addEventListener('load', actualizar);

// Actualizar al volver a primer plano si han pasado más de 10 minutos
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const ahora = Date.now();
    const ultima = parseInt(localStorage.getItem('ql_ultima_act') || '0', 10);
    if (ahora - ultima > 10 * 60 * 1000) actualizar();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

document.getElementById('panelMarea').addEventListener('click', abrirModalMarea);
document.getElementById('modalMarea').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalMarea')) cerrarModalMarea();
});

function abrirModalMarea() {
  const mdata = ultimosDatos && ultimosDatos.mdata;
  if (!mdata || !mdata.tiempos || !mdata.alturas) return;
  document.getElementById('modalMareaTit').textContent = T.mareasDeHoy || 'Mareas';
  renderModalMareaChart(mdata);
  renderModalMareaExtremost(mdata);
  document.getElementById('modalMarea').classList.add('abierto');
  document.body.style.overflow = 'hidden';
}

function cerrarModalMarea() {
  document.getElementById('modalMarea').classList.remove('abierto');
  document.body.style.overflow = '';
}

function renderModalMareaChart(mdata) {
  const { tiempos, alturas } = mdata;
  const ahora = Date.now();
  const W = 360, H = 130, PAD = 10;

  // Next 25 hours from now
  const startIdx = Math.max(0, tiempos.findIndex(t => new Date(t).getTime() >= ahora - 3600000));
  const endIdx = Math.min(tiempos.length - 1, startIdx + 25);
  const slice = alturas.slice(startIdx, endIdx + 1).map((h, i) => ({
    t: new Date(tiempos[startIdx + i]).getTime(), h: h ?? 0
  }));
  if (slice.length < 2) return;

  const minH = Math.min(...slice.map(p => p.h));
  const maxH = Math.max(...slice.map(p => p.h));
  const rangeH = maxH - minH || 1;
  const minT = slice[0].t, maxT = slice[slice.length - 1].t;
  const rangeT = maxT - minT || 1;

  const px = t => PAD + ((t - minT) / rangeT) * (W - 2 * PAD);
  const py = h => (H - PAD) - ((h - minH) / rangeH) * (H - 2 * PAD);

  // Build smooth path (cubic bezier)
  let d = `M ${px(slice[0].t)} ${py(slice[0].h)}`;
  for (let i = 1; i < slice.length; i++) {
    const x0 = px(slice[i-1].t), y0 = py(slice[i-1].h);
    const x1 = px(slice[i].t),   y1 = py(slice[i].h);
    const cpx = (x0 + x1) / 2;
    d += ` C ${cpx} ${y0}, ${cpx} ${y1}, ${x1} ${y1}`;
  }

  // Fill area
  const fillD = d + ` L ${px(slice[slice.length-1].t)} ${H} L ${px(slice[0].t)} ${H} Z`;

  // Now marker
  const nowX = Math.min(W - PAD, Math.max(PAD, px(ahora)));

  // Hour labels (every 6h)
  const labels = slice.filter((p, i) => {
    const hr = new Date(p.t).getHours();
    return i > 0 && i < slice.length - 1 && hr % 6 === 0;
  });

  const svg = `
    <defs>
      <linearGradient id="mgrd" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(100,180,255,0.45)"/>
        <stop offset="100%" stop-color="rgba(100,180,255,0.03)"/>
      </linearGradient>
    </defs>
    <path d="${fillD}" fill="url(#mgrd)"/>
    <path d="${d}" fill="none" stroke="rgba(120,200,255,0.9)" stroke-width="2" stroke-linecap="round"/>
    <line x1="${nowX}" y1="${PAD - 4}" x2="${nowX}" y2="${H - PAD + 4}" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-dasharray="3,3"/>
    ${labels.map(p => {
      const x = px(p.t);
      const label = new Date(p.t).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
      return `<text x="${x}" y="${H - 2}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">${label}</text>`;
    }).join('')}
    ${mdata.extremos.map(e => {
      const eT = e.hora;
      if (eT < minT || eT > maxT) return '';
      const ex = px(eT), ey = py(e.altura);
      const col = e.tipo === 'pleamar' ? 'rgba(120,220,255,1)' : 'rgba(180,220,255,0.7)';
      const label = new Date(eT).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
      const textY = e.tipo === 'pleamar' ? ey - 8 : ey + 16;
      return `<circle cx="${ex}" cy="${ey}" r="4" fill="${col}"/>
              <text x="${ex}" y="${textY}" text-anchor="middle" font-size="9.5" fill="${col}" font-weight="600">${label}</text>`;
    }).join('')}
  `;
  document.getElementById('mareaChart').innerHTML = svg;
}

function renderModalMareaExtremost(mdata) {
  const el = document.getElementById('modalExtremost');
  if (!mdata.extremos || !mdata.extremos.length) { el.innerHTML = ''; return; }
  el.innerHTML = mdata.extremos.map(e => {
    const hora = new Date(e.hora).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
    const label = e.tipo === 'pleamar' ? (T.pleamar || 'Pleamar') : (T.bajamar || 'Bajamar');
    return `<div class="modal-extremo">
      <div class="mex-tipo">${label}</div>
      <div class="mex-hora">${hora}</div>
      <div class="mex-alt">${e.altura.toFixed(2)} m</div>
    </div>`;
  }).join('');
}
