name: Barcos en puertos de España (Aisstream)

on:
  # Cron desactivado a proposito: el feature de barcos esta aparcado
  # (cobertura de Aisstream muy desigual entre zonas, preferimos no
  # mostrar datos que no se ajustan a la realidad). Se deja
  # workflow_dispatch para poder probar algo puntual a mano si hace
  # falta, sin gastar minutos de Actions ni generar commits automaticos
  # mientras el feature esta oculto en la app.
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets
      - name: Consultar Aisstream y generar barcos.json
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python barcos_puerto.py
      - name: Commit y push si hay cambios
        # OJO: sin "[skip ci]" a proposito -- este repo despliega GitHub
        # Pages via el workflow pages.yml, que se dispara con cada push a
        # main. Si se saltara el CI aqui, la web nunca recogeria el
        # barcos.json actualizado.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add barcos.json
          git diff --staged --quiet || git commit -m "Actualizar barcos.json"
          git diff --staged --quiet || git push
