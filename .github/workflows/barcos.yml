name: Barcos en puertos de España (Aisstream)

on:
  schedule:
    # Minutos :07/:27/:47 a propósito, no :00/:20/:40 -- GitHub avisa en su
    # documentación de que los minutos redondos (sobre todo el inicio de
    # cada hora) son los de más carga y los workflows programados ahí se
    # pueden saltar sin más (no se retrasan, se pierden). Descubierto tras
    # 2h+ sin que este cron se disparara ni una vez con '*/20 * * * *'.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install websockets
      - name: Consultar Aisstream y generar barcos.json
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python barcos_puerto.py
      - name: Commit y push si hay cambios
        # OJO: sin "[skip ci]" a proposito -- este repo despliega GitHub
        # Pages via el workflow pages.yml, que se dispara con cada push a
        # main. Si se saltara el CI aqui, la web nunca recogeria el
        # barcos.json actualizado.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add barcos.json
          git diff --staged --quiet || git commit -m "Actualizar barcos.json"
          git diff --staged --quiet || git push
